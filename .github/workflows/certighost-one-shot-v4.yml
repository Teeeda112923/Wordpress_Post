name: Certighost One Shot Publisher v4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: certighost-one-shot-v2
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.issue.title == '[one-shot] Certighost publish v4'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_FILE: projects/cybernote-security-news/data/certighost_one_shot.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results
      TARGET_NO: "9002"
      SLUG: ad-cs-certighost-cve-2026-54121
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost v4 publish started. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Generate and fully validate eyecatch
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1200, 800
          BG = '#0B1F33'; PANEL = '#102A43'; PANEL2 = '#123651'
          CYAN = '#22D3EE'; GREEN = '#34D399'; RED = '#F43F5E'
          WHITE = '#F8FAFC'; MUTED = '#B7C7D6'; GRID = '#12304A'
          FONT_REG = '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          FONT_BOLD = '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          def F(size, bold=False):
              return ImageFont.truetype(FONT_BOLD if bold else FONT_REG, size)

          img = Image.new('RGB', (W, H), BG)
          d = ImageDraw.Draw(img)
          for x in range(0, W, 60): d.line((x, 0, x, H), fill=GRID, width=1)
          for y in range(0, H, 60): d.line((0, y, W, y), fill=GRID, width=1)

          d.rounded_rectangle((58, 54, 330, 112), 18, outline=CYAN, width=3, fill='#0D253A')
          d.text((82, 69), 'セキュリティニュース', font=F(24, True), fill=CYAN)
          d.text((60, 155), 'AD CSの脆弱性', font=F(62, True), fill=WHITE)
          d.text((60, 240), '「Certighost」とは？', font=F(58, True), fill=CYAN)
          d.line((64, 330, 235, 330), fill=CYAN, width=5)
          d.text((60, 365), 'CVE-2026-54121', font=F(35, True), fill=RED)
          d.text((338, 370), '低権限からドメイン侵害の恐れ', font=F(27, True), fill=WHITE)
          d.rounded_rectangle((60, 674, 470, 744), 18, fill='#0D253A', outline=GREEN, width=2)
          d.text((90, 690), '影響・仕組み・対策を解説', font=F(28, True), fill=WHITE)

          d.rounded_rectangle((665, 145, 990, 480), 24, fill=PANEL2, outline=CYAN, width=4)
          d.text((762, 168), '証明書', font=F(34, True), fill=WHITE)
          d.line((700, 220, 955, 220), fill=CYAN, width=2)
          d.text((705, 245), '発行先', font=F(20, True), fill=MUTED)
          d.text((705, 277), 'CN=Domain Controller', font=F(22, True), fill=WHITE)
          d.text((705, 325), '発行者', font=F(20, True), fill=MUTED)
          d.text((705, 357), 'Enterprise CA', font=F(22, True), fill=WHITE)
          d.text((705, 405), 'CVE-2026-54121', font=F(20, True), fill=RED)
          d.ellipse((900, 393, 960, 453), fill=GREEN, outline=WHITE, width=2)
          d.line((916, 423, 929, 436, 950, 410), fill=WHITE, width=5)

          ghost = '#B9DCF0'
          d.ellipse((960, 50, 1125, 235), fill=ghost)
          d.polygon([(960,145),(1125,145),(1160,390),(1120,360),(1085,395),(1050,360),(1015,395),(975,360)], fill=ghost)
          d.ellipse((997,112,1024,151), fill=BG)
          d.ellipse((1063,112,1090,151), fill=BG)

          d.ellipse((620,555,715,650), outline=MUTED, width=3, fill=PANEL)
          d.ellipse((653,573,682,602), fill=MUTED)
          d.pieslice((638,596,697,642), 180, 360, fill=MUTED)
          d.text((592,657), '低権限ユーザー', font=F(21, True), fill=CYAN)

          d.rounded_rectangle((965,505,1143,721), 14, fill='#0E263C', outline='#3A6788', width=3)
          d.text((983,525), 'Domain Controller', font=F(17, True), fill=WHITE)
          for yy in (570,610,650):
              d.rounded_rectangle((985,yy,1125,yy+25), 6, fill=PANEL2)
              d.ellipse((1095,yy+8,1105,yy+18), fill=CYAN)
              d.ellipse((1110,yy+8,1120,yy+18), fill=GREEN)
          crown=[(1020,696),(1035,670),(1055,690),(1073,660),(1093,690),(1112,670),(1125,696)]
          d.line(crown, fill=RED, width=5)
          d.line((1020,696,1125,696), fill=RED, width=5)
          for xx in range(735,855,22): d.ellipse((xx,603,xx+8,611), fill=CYAN)
          d.polygon([(880,565),(930,650),(830,650)], outline=RED, fill='#172A3E')
          d.text((870,594), '!', font=F(34, True), fill=RED)
          d.line((930,625,1000,590), fill=RED, width=6)
          d.polygon([(1000,590),(982,585),(994,606)], fill=RED)
          d.text((817,684), '権限昇格・横展開', font=F(22, True), fill=RED)
          d.text((1045,752), 'CyberNote', font=F(18), fill=MUTED)

          out = Path('projects/cybernote-security-news/eyecatches/ad-cs-certighost-cve-2026-54121.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          img.save(out, 'PNG', optimize=True, compress_level=9)
          with Image.open(out) as check:
              check.load()
              print('validated:', check.size, check.mode, out.stat().st_size)
              assert check.size == (1200, 800)
              assert check.mode == 'RGB'
          assert out.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          PY

      - name: GEO article quality gate
        run: |
          python article_quality_check.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/certighost_quality.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --skip-existing-check \
            --output-dir "$RESULTS_DIR"

      - name: Verify WordPress result
        id: verify
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          files = sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'), key=lambda p: p.stat().st_mtime)
          if not files: raise SystemExit('WordPress result CSV not found')
          with files[-1].open(encoding='utf-8-sig', newline='') as f: rows = list(csv.DictReader(f))
          rows = [r for r in rows if str(r.get('no','')).strip() == '9002']
          if not rows: raise SystemExit('No.9002 result not found')
          r = rows[-1]
          status = (r.get('status') or '').strip().lower()
          post_id = (r.get('post_id') or '').strip()
          post_link = (r.get('post_link') or '').strip()
          print('status:', status); print('post_id:', post_id); print('post_link:', post_link)
          if status not in {'posted','updated'}:
              raise SystemExit(r.get('error_content') or r.get('message') or f'unexpected status: {status}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'post_id={post_id}\npost_link={post_link}\n')
          PY

      - name: Sync validated eyecatch to main
        if: success()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IMAGES_DIR/$SLUG.png"
          if ! git diff --cached --quiet; then
            git commit -m "Replace Certighost eyecatch with validated PNG [skip ci]"
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POST_ID: ${{ steps.verify.outputs.post_id }}
          POST_LINK: ${{ steps.verify.outputs.post_link }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost publish succeeded. Post ID: $POST_ID  URL: $POST_LINK"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost publish failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certighost-v4-results
          path: projects/cybernote-security-news/results/*.csv
          if-no-files-found: warn
          retention-days: 7
