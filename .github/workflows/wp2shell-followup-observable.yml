name: WP2Shell Follow-up Observable One Shot

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wp2shell-followup-observable
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.issue.title == '[one-shot] WP2Shell publish v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_FILE: projects/cybernote-security-news/data/wp2shell_followup_one_shot.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results
      SLUG: wordpress-wp2shell-followup-exploitation-observed
      TARGET_NO: "9001"
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WP2Shell retry-safe run started. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Noto Sans CJK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Generate and validate eyecatch
        run: |
          python projects/cybernote-security-news/src/generate_wp2shell_followup_eyecatch.py

      - name: Commit eyecatch with rebase retry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IMAGES_DIR/$SLUG.png"
          if git diff --cached --quiet; then
            echo "Eyecatch already present"
            exit 0
          fi
          git commit -m "Add WP2Shell follow-up eyecatch [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Eyecatch pushed"
              exit 0
            fi
            echo "Push conflict; rebasing onto latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "Eyecatch push failed after retries" >&2
          exit 1

      - name: GEO quality gate
        run: |
          python article_quality_check.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/wp2shell_followup_quality.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --skip-existing-check \
            --output-dir "$RESULTS_DIR"

      - name: Verify result
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          files = sorted(Path("projects/cybernote-security-news/results").glob("results_*.csv"))
          if not files:
              raise SystemExit("WordPress result CSV not found")
          with files[-1].open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          rows = [r for r in rows if str(r.get("no", "")).strip() == "9001"]
          if not rows:
              raise SystemExit("No.9001 result not found")
          row = rows[-1]
          status = (row.get("status") or "").strip().lower()
          print("status:", status)
          print("post_id:", row.get("post_id", ""))
          print("post_link:", row.get("post_link", ""))
          if status not in {"posted", "updated"}:
              raise SystemExit(row.get("error_content") or row.get("message") or status)
          PY

      - name: Report final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          STATUS="none"
          LINK="none"
          ERROR="none"
          if ls "$RESULTS_DIR"/results_*.csv >/dev/null 2>&1; then
            mapfile -t V < <(python - <<'PY'
          import csv
          from pathlib import Path
          status='none'; link='none'; error='none'
          files=sorted(Path('projects/cybernote-security-news/results').glob('results_*.csv'))
          if files:
              with files[-1].open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
              rows=[r for r in rows if str(r.get('no','')).strip()=='9001']
              if rows:
                  row=rows[-1]
                  status=(row.get('status') or 'none').strip()
                  link=(row.get('post_link') or 'none').strip()
                  error=(row.get('error_content') or row.get('message') or 'none').strip().replace('\n',' ')[:300]
          print(status); print(link); print(error)
          PY
          )
            STATUS="${V[0]:-none}"
            LINK="${V[1]:-none}"
            ERROR="${V[2]:-none}"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "WP2Shell finished: job=$JOB_STATUS, result=$STATUS, post=$LINK, error=$ERROR. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
