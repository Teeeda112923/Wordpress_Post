name: CyberNote Repair GEO Duplicates

# 公開済みのNo.30、No.31、No.37へ、重複FAQ・出典を除いた本文と
# GEOフロントマターを一度だけ再同期するための一時ワークフロー。
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cybernote-repair-geo-duplicates.yml

permissions:
  contents: read

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair published CyberNote GEO duplicates'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      LEDGER: projects/cybernote-security-news/data/news_ledger.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CyberNote regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Validate repaired articles
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "30,31,37" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Update published WordPress posts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode update_only \
            --category "サイバーセキュリティ" \
            --nos "30,31,37" \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --slug-only-existing-check \
            --sleep 300 \
            --output-dir "$RESULTS_DIR"

      - name: Verify update results
        run: |
          python - <<'PY'
          import csv
          import sys
          from pathlib import Path

          expected = {"30", "31", "37"}
          files = sorted(Path("projects/cybernote-security-news/results").glob("results_*.csv"))
          if not files:
              print("投稿結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)
          with files[-1].open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          status = {str(row.get("no", "")).strip(): row.get("status", "") for row in rows}
          failed = {no: status.get(no, "missing") for no in expected if status.get(no) != "updated"}
          if failed:
              print(f"更新失敗: {failed}", file=sys.stderr)
              sys.exit(1)
          print(f"公開済み投稿の更新を確認しました: {sorted(expected)}")
          PY
