name: CyberNote Security News Temporary Dry Run

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select test article
        id: select
        run: |
          NEWS_NO="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "2099-12-31" \
            --stage draft)"

          test "$NEWS_NO" = "9999"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

      - name: Article quality gate
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --include-unstarted \
            --fail-on-error

      - name: WordPress dry-run
        env:
          WP_BASE_URL: ""
          WP_USERNAME: ""
          WP_APP_PASSWORD: ""
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status draft \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --limit 1 \
            --output-dir "$RESULTS_DIR" \
            --dry-run

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-test-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 7
