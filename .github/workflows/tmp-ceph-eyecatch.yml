name: Temporary Ceph Eyecatch Generator

on:
  push:
    paths:
      - ".github/workflows/tmp-ceph-eyecatch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip install "Pillow>=10.3.0"
      - name: Generate and validate image
        run: python projects/cybernote-security-news/tmp_generate_ceph_eyecatch.py
      - name: Commit image and remove temporary generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cybernote-security-news/eyecatches/ceph-cve-2026-50152-monitor-config-key-secrets.png
          git rm projects/cybernote-security-news/tmp_generate_ceph_eyecatch.py .github/workflows/tmp-ceph-eyecatch.yml
          git commit -m "Add Ceph CVE-2026-50152 eyecatch"
          git push
