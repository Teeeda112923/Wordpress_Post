name: Inspect Post 8229 (read-only)
# Read-only investigation (output committed as text) after post 8229 (Metabase CVE-2026-72898) was overwritten by the what-is-api run on 2026-10-16. No writes.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-post-8229-20261016.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt PyYAML
      - name: Inspect
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os, re, builtins
          _out=open('.github/inspect-post-8229-20261016.txt','w',encoding='utf-8')
          def print(*a,**k):
              builtins.print(*a,**k); builtins.print(*a,file=_out)
          from wp_auto_post import WordPressClient
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          p=wp.request('GET','posts/8229',params={'context':'edit'})
          print('CURRENT', p['slug'], p['status'], p['date'], p['modified'], 'media', p['featured_media'], 'cats', p['categories'], 'tags', p['tags'])
          print('META', {k:(str(v)[:80]) for k,v in (p.get('meta') or {}).items()})
          revs=wp.request('GET','posts/8229/revisions',params={'context':'edit','per_page':100})
          for r in revs:
              c=re.sub(r'<[^>]+>','',r['content']['raw'] if isinstance(r['content'],dict) and 'raw' in r['content'] else r['content'].get('rendered',''))
              print('REV', r['id'], r['date'], r['modified'], '|', r['title'].get('raw') or r['title'].get('rendered'), '| len', len(c), '|', c.strip()[:60].replace('\n',' '))
          for q in ['metabase','cve-2026-72898']:
              for m in wp.request('GET','media',params={'search':q,'per_page':20,'context':'edit'}) or []:
                  print('MEDIA', q, m['id'], m['date'], m.get('source_url'), 'parent', m.get('post'))
          for t in p['tags']:
              tt=wp.request('GET',f'tags/{t}'); print('TAG', t, tt.get('name'))
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspect-post-8229-20261016.txt
          git commit -m "Record post 8229 inspection output" || exit 0
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 3; done; exit 1
