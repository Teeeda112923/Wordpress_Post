name: Publish Incident Articles 2026-10-21
# User-approved articles (2026-10-21): Furusato Choice (No.220), H2O ID (No.221),
# JFA Passport (No.222). Long-form with GEO Kit metadata and user-supplied
# eyecatches. Published one at a time, 10 minutes apart.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-incidents-20261021.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news-fast-publish
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NOS: '220 221 222'
  INTERVAL_SEC: '600'
  STATUS_FILE: .github/incidents-20261021-publication-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '1'
  WP_SERVER_ERROR_RETRY_COUNT: '2'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML
          mkdir -p "$RESULTS_DIR"

      - name: Verify selected eyecatch identity
        run: |
          python verify_eyecatch_identity.py \
            --ledger "$LEDGER" \
            --images-dir "$IMAGES_DIR" \
            --nos "${TARGET_NOS// /,}" \
            --require-from-no 147

      - name: Verify long-form article metadata
        run: |
          python - <<'PY'
          import csv, os, re, yaml
          from pathlib import Path
          with open(os.environ['LEDGER'], encoding='utf-8-sig', newline='') as f:
              rows = {r['No']: r for r in csv.DictReader(f)}
          for no in os.environ['TARGET_NOS'].split():
              row = rows[no]
              text = Path(row['記事ファイル']).read_text(encoding='utf-8')
              m = re.match(r'^---\s*\n(.*?)\n---\s*\n(.*)$', text, re.S)
              if not m:
                  raise SystemExit(f'No.{no}: front matter missing')
              meta = yaml.safe_load(m.group(1)) or {}
              body = m.group(2)
              if not str(meta.get('answer') or '').strip().endswith('。'):
                  raise SystemExit(f'No.{no}: answer missing')
              if len(meta.get('faq') or []) < 2:
                  raise SystemExit(f'No.{no}: faq incomplete')
              if len(meta.get('sources') or []) < 1:
                  raise SystemExit(f'No.{no}: sources incomplete')
              if '## まとめ' not in body:
                  raise SystemExit(f'No.{no}: summary section missing')
              print(f'No.{no}: user-supplied article accepted by explicit user instruction.')
          PY

      - name: Run regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Publish one by one and update ledger
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          : > "$STATUS_FILE"
          first=1
          for no in $TARGET_NOS; do
            if [ "$first" -eq 0 ]; then
              echo "Waiting ${INTERVAL_SEC}s before No.${no}"
              sleep "$INTERVAL_SEC"
            fi
            first=0
            out="$RESULTS_DIR/no-$no"
            mkdir -p "$out"
            python wp_auto_post.py \
              --input "$LEDGER" \
              --articles-dir "$ARTICLES_DIR" \
              --images-dir "$IMAGES_DIR" \
              --post-status publish \
              --write-mode upsert \
              --category "サイバーセキュリティ" \
              --nos "$no" \
              --limit 1 \
              --skip-auth-check \
              --skip-internal-link-resolution \
              --fallback-media-id "$FALLBACK_MEDIA_ID" \
              --output-dir "$out"
            TARGET_NO="$no" RESULT_DIR="$out" python - <<'PY'
          import csv, datetime as dt, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          no = os.environ['TARGET_NO']
          files = sorted(Path(os.environ['RESULT_DIR']).glob('results_*.csv'))
          if not files:
              raise SystemExit(f'No.{no}: result CSV missing')
          with files[-1].open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          matches = [r for r in rows if str(r.get('no', '')).strip() == no]
          if not matches:
              raise SystemExit(f'No.{no}: target result missing')
          result = matches[-1]
          status = (result.get('status') or '').strip().lower()
          if status not in {'posted', 'updated'}:
              raise SystemExit(f"No.{no}: publication failed: {status}: {result.get('error_content') or result.get('message') or ''}")
          post_id = int(result.get('post_id') or 0)
          post_url = result.get('post_link') or ''
          if not post_id or not post_url:
              raise SystemExit(f'No.{no}: post id/url missing')

          ledger = Path(os.environ['LEDGER'])
          with ledger.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              data = list(reader)
          row = next((r for r in data if str(r.get('No', '')).strip() == no), None)
          if row is None:
              raise SystemExit(f'No.{no}: ledger row missing')
          slug = row['スラッグ']

          wp = WordPressClient(os.environ['WP_BASE_URL'], os.environ['WP_USERNAME'], os.environ['WP_APP_PASSWORD'])
          post = wp.request('GET', f'posts/{post_id}', params={'context': 'edit'})
          if post.get('status') != 'publish':
              raise SystemExit(f"No.{no}: unexpected post status: {post.get('status')}")
          media_id = int(post.get('featured_media') or 0)
          if not media_id:
              raise SystemExit(f'No.{no}: featured media missing')
          media = wp.request('GET', f'media/{media_id}', params={'context': 'edit'})
          media_source = str(media.get('source_url') or '')
          if slug not in media_source:
              raise SystemExit(f'No.{no}: eyecatch mismatch: {media_source}')
          meta = post.get('meta') or {}
          missing = [k for k in ('_cng_answer', '_cng_faq', '_cng_sources') if not meta.get(k)]
          if missing:
              raise SystemExit(f'No.{no}: GEO metadata missing: ' + ','.join(missing))
          faq = json.loads(meta['_cng_faq']) if isinstance(meta['_cng_faq'], str) else meta['_cng_faq']
          sources = json.loads(meta['_cng_sources']) if isinstance(meta['_cng_sources'], str) else meta['_cng_sources']
          if len(faq) < 2 or len(sources) < 1:
              raise SystemExit(f'No.{no}: GEO metadata incomplete')

          row['投稿ステータス'] = '公開済み'
          row['WP投稿ID'] = str(post_id)
          row['WP投稿URL'] = post_url
          row['最終更新日時'] = dt.datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          row['エラー内容'] = ''
          with ledger.open('w', encoding='utf-8', newline='') as f:
              f.write('﻿')
              w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
              w.writeheader()
              w.writerows(data)
          with Path(os.environ['STATUS_FILE']).open('a', encoding='utf-8') as f:
              f.write(f"no={no} state=published post_id={post_id} post_url={post_url} featured_media={media_id} geo_faq={len(faq)} geo_sources={len(sources)}\n")
          print(f'No.{no}: {post_url}')
          PY
            # Record each article as soon as it is live, so a later failure keeps earlier results.
            git add "$LEDGER" "$STATUS_FILE"
            git commit -m "Record No.$no incident article publication" || true
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then break; fi
              git pull --rebase origin main
              sleep $((attempt * 3))
            done
          done
          echo "run_url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$STATUS_FILE"
          git add "$STATUS_FILE"
          git commit -m "Record incident articles publication run" || true
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incidents-20261021-publication-results
          path: |
            ${{ env.RESULTS_DIR }}/**/*.csv
          if-no-files-found: warn
          retention-days: 14
