name: Check Eyecatches

# 壊れたアイキャッチ画像がコミットされたことを、その場で知らせる。
#
# 画像が途中で切れていても Image.open() は形式とサイズを返すため、見た目の
# ファイル一覧では気づけない。これまでは投稿枠が失敗して初めて分かる状態で、
# 実際に丸1日以上、毎枠失敗し続けた（スコア1位の記事の画像が壊れていたため、
# 投稿できる記事があっても順番が回ってこなかった）。
# 画像を追加・変更したコミットで検査し、壊れていれば赤いバツを出す。
on:
  push:
    paths:
      - "**/eyecatches/**.png"
      - "eyecatch_file_check.py"
      - ".github/workflows/check-eyecatches.yml"
  pull_request:
    paths:
      - "**/eyecatches/**.png"
      - "eyecatch_file_check.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 検査に必要なのは Pillow だけ。requirements.txt を丸ごと入れると
      # pandas等の取得で時間がかかり、気づくのが遅れるため最小限にする。
      - name: Install Pillow
        run: pip install "Pillow>=10.3.0"

      - name: Check eyecatch images
        # ユーザー指定で意図的に残す既存破損画像2枚だけをCIから除外する。
        # 投稿時の画像検証や単体チェッカーの判定は変更しない。
        run: |
          python - <<'PY'
          import subprocess
          import sys
          from pathlib import Path
          from eyecatch_file_check import collect

          excluded = {
              Path("projects/cybernote-security-news/eyecatches/microsoft-entra-id-cve-2026-62916-authentication-bypass.png").resolve(),
              Path("projects/cybernote-security-news/eyecatches/m-trends-2026-cyberattack-22-seconds.png").resolve(),
          }
          targets = []
          for path in collect([]):
              if path.resolve() in excluded:
                  print(f"[SKIP] ユーザー指定の既存成果物: {path}", flush=True)
              else:
                  targets.append(str(path))
          if not targets:
              raise SystemExit("検査対象のPNGが見つかりません。")
          subprocess.run([sys.executable, "eyecatch_file_check.py", *targets], check=True)
          PY
