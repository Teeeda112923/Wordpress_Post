name: Add consultation chart to fuyouhin-kaishu-sagi-mikata 2026-11-23
# User-approved update (2026-11-23): adds a CyberNote-made bar chart (data: 国民生活センター) to No.348 (post 9734).
# Keeps slug, URL, eyecatch, affiliate tags and GEO metadata.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-fuyouhin-chart-20261123.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news-fast-publish
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGETS: '348:fuyouhin-kaishu-sagi-mikata:9734'
  TARGET_NOS: '348'
  ARTICLE: projects/cybernote-security-news/articles/fuyouhin-kaishu-sagi-mikata.md
  INLINE_IMAGE: projects/cybernote-security-news/article-images/fuyouhin-kaishu-sagi-mikata-soudan.png
  STATUS_FILE: .github/fuyouhin-chart-refresh-20261123-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '1'
  WP_SERVER_ERROR_RETRY_COUNT: '2'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML
          mkdir -p "$RESULTS_DIR"

      - name: Verify articles and existing eyecatches
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml, os
          for item in os.environ['TARGETS'].split(','):
              no, slug, _ = item.split(':')
              if not (Path(os.environ['IMAGES_DIR'])/(slug+'.png')).stat().st_size:
                  raise SystemExit(f'eyecatch missing: {slug}')
              text=(Path(os.environ['ARTICLES_DIR'])/(slug+'.md')).read_text(encoding='utf-8')
              m=re.match(r'^---\s*\n(.*?)\n---\s*\n(.*)$',text,re.S)
              if not m: raise SystemExit(f'front matter missing: {slug}')
              meta=yaml.safe_load(m.group(1)) or {}; body=m.group(2)
              if not str(meta.get('answer') or '').strip().endswith('。'): raise SystemExit(f'answer missing: {slug}')
              if len(meta.get('faq') or [])<3 or len(meta.get('sources') or [])<3: raise SystemExit(f'GEO incomplete: {slug}')
              if '## まとめ' not in body: raise SystemExit(f'summary missing: {slug}')
              if 'px.a8.net' not in body: raise SystemExit(f'affiliate tag missing: {slug}')
              for banned in ('WEB完結','営業電話がない','営業電話なし'):
                  if banned in body: raise SystemExit(f'prohibited claim in {slug}: {banned}')
          print('User-approved wording update accepted.')
          PY

      - name: Run regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Upload inline chart and inject URL
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from wp_auto_post import WordPressClient
          article=Path(os.environ["ARTICLE"]); md=article.read_text(encoding="utf-8")
          marker="{{INLINE_IMAGE_URL}}"
          if marker in md:
              wp=WordPressClient(os.environ["WP_BASE_URL"],os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
              _, url=wp.upload_media(Path(os.environ["INLINE_IMAGE"]), alt_text="不用品回収サービスに関する相談件数の推移（国民生活センター）")
              if not url: raise RuntimeError("inline media URL missing")
              article.write_text(md.replace(marker,url),encoding="utf-8")
              print("inline image uploaded:", url)
          else:
              print("inline image URL already injected; skipping upload")
          PY

      - name: Update existing WordPress posts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NOS" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify live posts
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient
          files=sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'))
          if not files: raise SystemExit('result CSV missing')
          with files[-1].open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          lines=['state=updated']
          for item in os.environ['TARGETS'].split(','):
              no, slug, expected = item.split(':')
              matches=[r for r in rows if str(r.get('no','')).strip()==no]
              if not matches: raise SystemExit(f'target result missing: {no}')
              result=matches[-1]
              if (result.get('status') or '').strip().lower()!='updated':
                  raise SystemExit(f'update failed No.{no}: {result}')
              post_id=int(result.get('post_id') or 0)
              if post_id!=int(expected): raise SystemExit(f'unexpected post id No.{no}: {post_id}')
              post=wp.request('GET',f'posts/{post_id}',params={'context':'edit'})
              if post.get('status')!='publish': raise SystemExit(f"unexpected status No.{no}: {post.get('status')}")
              if slug not in str(post.get('slug') or ''): raise SystemExit(f"slug mismatch No.{no}: {post.get('slug')}")
              raw=str((post.get('content') or {}).get('raw') or '')
              if 'px.a8.net' not in raw: raise SystemExit(f'affiliate tag lost No.{no}')
              if 'fuyouhin-kaishu-sagi-mikata-soudan' not in raw: raise SystemExit(f'inline chart missing No.{no}')
              media_id=int(post.get('featured_media') or 0)
              if not media_id: raise SystemExit(f'featured media missing No.{no}')
              media=wp.request('GET',f'media/{media_id}',params={'context':'edit'})
              source=str(media.get('source_url') or '')
              if slug not in source: raise SystemExit(f'eyecatch mismatch No.{no}: {source}')
              meta=post.get('meta') or {}
              missing=[k for k in ['_cng_answer','_cng_faq','_cng_sources'] if not meta.get(k)]
              if missing: raise SystemExit(f'GEO metadata missing No.{no}: '+','.join(missing))
              lines.append(f'no{no}_post_id={post_id}\nno{no}_post_url={result.get("post_link") or ""}\nno{no}_media={source}')
              print('UPDATED:', result.get('post_link'))
          lines.append(f'run_url=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}')
          Path(os.environ['STATUS_FILE']).write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Commit refresh result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$ARTICLE" "$STATUS_FILE"
          git commit -m "Record fuyouhin chart refresh" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuyouhin-chart-refresh-20261123-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 14
