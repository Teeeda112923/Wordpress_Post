name: One-off CyberNote IPA Safe Web Guide Publish

on:
  push:
    paths:
      - .github/workflows/codex-ipa-safe-web-guide-oneoff.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Run IPA safe web guide WordPress publish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEDGER: projects/cybernote-security-news/data/news_ledger.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results
      TARGET_DATE: "2026-08-03"
      TARGET_NO: "17"
      SLUG: ipa-safe-web-development-guide
      PNG_PATH: projects/cybernote-security-news/eyecatches/ipa-safe-web-development-guide.png

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Register article in news ledger
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          ledger = Path(os.environ["LEDGER"])
          with ledger.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              rows = list(reader)

          values = {
              "No": os.environ["TARGET_NO"],
              "収集日": os.environ["TARGET_DATE"],
              "公開予定日": os.environ["TARGET_DATE"],
              "記事分類": "ウェブセキュリティ",
              "指定KW": "IPA 安全なウェブサイトの作り方",
              "話題性スコア": "90",
              "記事タイトル案": "【保存版】IPA「安全なウェブサイトの作り方」とは？11の脆弱性と対策を解説",
              "記事タイトル": "【保存版】IPA「安全なウェブサイトの作り方」とは？11の脆弱性と対策を解説",
              "スラッグ": os.environ["SLUG"],
              "メタディスクリプション": "IPA「安全なウェブサイトの作り方」を初心者向けに解説。11種類の脆弱性、根本的な対策、公開後の運用、開発時の確認手順をまとめます。",
              "WPカテゴリ": "サイバーセキュリティ",
              "タグ案": "IPA,ウェブセキュリティ,脆弱性,安全なウェブサイトの作り方,Web開発",
              "記事ファイル": f"{os.environ['ARTICLES_DIR']}/{os.environ['SLUG']}.md",
              "画像ファイル名": os.environ["PNG_PATH"],
              "主な出典URL": "https://www.ipa.go.jp/security/vuln/websecurity/about.html",
              "内部リンクURL": "https://www.cybernote.click/wp-security-checker-guide/",
              "目標文字数": "7205",
              "生成ステータス": "生成済み",
              "レビュー判定": "未確認",
              "公開停止": "",
          }

          target = next((row for row in rows if str(row.get("No", "")).strip() == os.environ["TARGET_NO"]), None)
          if target is None:
              target = {name: "" for name in fieldnames}
              target.update(values)
              rows.append(target)
              print(f"管理簿にNo.{os.environ['TARGET_NO']}を追加しました。")
          else:
              preserved = {
                  key: target.get(key, "")
                  for key in ("WP投稿ID", "WP投稿URL", "投稿ステータス", "最終更新日時", "エラー内容")
              }
              target.update(values)
              target.update(preserved)
              print(f"管理簿のNo.{os.environ['TARGET_NO']}を再利用します。")

          with ledger.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          PY

      - name: Generate 1200x800 PNG eyecatch
        run: |
          python - <<'PY'
          from pathlib import Path
          import math
          import os
          from PIL import Image, ImageDraw, ImageFont

          width, height = 1200, 800
          image = Image.new("RGB", (width, height), "#071A2D")
          pixels = image.load()
          for y in range(height):
              for x in range(width):
                  glow = max(0.0, 1.0 - math.hypot(x - 930, y - 250) / 760)
                  r = int(7 + 7 * glow)
                  g = int(26 + 35 * glow)
                  b = int(45 + 46 * glow)
                  pixels[x, y] = (r, g, b)

          draw = ImageDraw.Draw(image)
          font_dir = Path("/usr/share/fonts/opentype/noto")
          bold_candidates = list(font_dir.glob("NotoSansCJK-Bold.ttc")) + list(font_dir.glob("*Sans*CJK*Bold*"))
          regular_candidates = list(font_dir.glob("NotoSansCJK-Regular.ttc")) + list(font_dir.glob("*Sans*CJK*Regular*"))
          if not bold_candidates or not regular_candidates:
              raise RuntimeError("Noto Sans CJK font was not found")
          bold_path = str(bold_candidates[0])
          regular_path = str(regular_candidates[0])

          badge_font = ImageFont.truetype(bold_path, 28)
          title_font = ImageFont.truetype(bold_path, 63)
          subtitle_font = ImageFont.truetype(bold_path, 39)
          body_font = ImageFont.truetype(regular_path, 25)
          footer_font = ImageFont.truetype(bold_path, 23)

          for offset in range(0, 900, 110):
              x0 = 650 + offset // 3
              draw.line((x0, 50, x0 + 260, 310), fill="#173B55", width=2)
              draw.ellipse((x0 + 253, 303, x0 + 267, 317), outline="#22D3EE", width=2)

          panel = (680, 135, 1110, 560)
          draw.rounded_rectangle(panel, radius=28, fill="#0D2940", outline="#3A6078", width=3)
          draw.rounded_rectangle((700, 157, 1090, 540), radius=20, fill="#F4F8FB")
          draw.rectangle((700, 157, 1090, 215), fill="#DCE8EF")
          for i, color in enumerate(("#F43F5E", "#F59E0B", "#34D399")):
              cx = 730 + i * 31
              draw.ellipse((cx - 8, 170, cx + 8, 186), fill=color)
          draw.rounded_rectangle((825, 172, 1058, 194), radius=10, fill="#B7CBD7")
          draw.rounded_rectangle((735, 255, 1055, 287), radius=12, fill="#D9E4EA")
          draw.rounded_rectangle((735, 312, 1005, 337), radius=10, fill="#D9E4EA")
          draw.rounded_rectangle((735, 367, 1035, 392), radius=10, fill="#D9E4EA")
          draw.rounded_rectangle((735, 422, 940, 469), radius=14, fill="#22D3EE")

          shield = [(955, 300), (1055, 335), (1040, 445), (1005, 500), (955, 535), (905, 500), (870, 445), (855, 335)]
          draw.polygon(shield, fill="#0B1F33", outline="#34D399")
          draw.line((903, 412, 940, 449), fill="#34D399", width=18)
          draw.line((940, 449, 1012, 370), fill="#34D399", width=18)

          draw.rounded_rectangle((76, 75, 330, 124), radius=20, fill="#123A55", outline="#22D3EE", width=2)
          draw.text((99, 85), "保存版・IPA解説", font=badge_font, fill="#D8F7FF")
          draw.text((74, 174), "安全なウェブサイト", font=title_font, fill="#F7FAFC")
          draw.text((74, 255), "の作り方", font=title_font, fill="#F7FAFC")
          draw.text((76, 365), "11の脆弱性と対策", font=subtitle_font, fill="#22D3EE")
          draw.text((77, 430), "設計・実装・運用の要点", font=body_font, fill="#C5D6E0")

          draw.rounded_rectangle((68, 650, 1132, 732), radius=22, fill="#0B2539", outline="#28516A", width=2)
          footer = "入力を信用しない  ×  命令とデータを分ける"
          box = draw.textbbox((0, 0), footer, font=footer_font)
          tx = (width - (box[2] - box[0])) // 2
          draw.text((tx, 675), footer, font=footer_font, fill="#EAF5F8")

          path = Path(os.environ["PNG_PATH"])
          path.parent.mkdir(parents=True, exist_ok=True)
          image.save(path, format="PNG", optimize=True)
          with Image.open(path) as checked:
              if checked.format != "PNG" or checked.size != (1200, 800):
                  raise RuntimeError(f"Invalid eyecatch: {checked.format} {checked.size}")
          print(f"Eyecatch generated: {path} ({path.stat().st_size} bytes)")
          PY

      - name: GEO article quality gate
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Create WordPress draft
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status draft \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --skip-existing-check \
            --output-dir "$RESULTS_DIR"

      - name: Verify draft and update local ledger
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"]
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not result_files:
              print("投稿結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              results = list(csv.DictReader(handle))
          matches = [row for row in results if str(row.get("no", "")).strip() == selected]
          if not matches:
              print(f"No.{selected}の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status not in {"posted", "updated"}:
              print(f"下書き作成に失敗しました: {status} / {result.get('error_content') or result.get('message')}", file=sys.stderr)
              sys.exit(1)

          ledger = Path(os.environ["LEDGER"])
          with ledger.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              rows = list(reader)
          target = next((row for row in rows if str(row.get("No", "")).strip() == selected), None)
          if target is None:
              print(f"管理簿にNo.{selected}がありません。", file=sys.stderr)
              sys.exit(1)
          target["投稿ステータス"] = "下書き済み"
          target["WP投稿ID"] = result.get("post_id", "")
          target["WP投稿URL"] = result.get("post_link", "")
          target["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          target["エラー内容"] = ""
          with ledger.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print(f"WordPress draft: {status} / post_id={target['WP投稿ID']} / {target['WP投稿URL']}")
          PY

      - name: Publish dry-run
        run: |
          python projects/cybernote-security-news/src/publish_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --results-dir "$RESULTS_DIR" \
            --date "$TARGET_DATE" \
            --no "$TARGET_NO" \
            --dry-run

      - name: Publish article
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python projects/cybernote-security-news/src/publish_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --results-dir "$RESULTS_DIR" \
            --date "$TARGET_DATE" \
            --no "$TARGET_NO"

      - name: Verify publish and update ledger
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"]
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("publish_*.csv"))
          if not result_files:
              print("公開結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              results = list(csv.DictReader(handle))
          matches = [row for row in results if str(row.get("No", "")).strip() == selected]
          if not matches:
              print(f"No.{selected}の公開結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status not in {"published", "already_published"}:
              print(f"公開に失敗しました: {status} / {result.get('message')}", file=sys.stderr)
              sys.exit(1)

          ledger = Path(os.environ["LEDGER"])
          with ledger.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              rows = list(reader)
          target = next((row for row in rows if str(row.get("No", "")).strip() == selected), None)
          if target is None:
              print(f"管理簿にNo.{selected}がありません。", file=sys.stderr)
              sys.exit(1)
          target["投稿ステータス"] = "公開済み"
          target["WP投稿ID"] = result.get("post_id", "") or target.get("WP投稿ID", "")
          target["WP投稿URL"] = result.get("post_link", "") or target.get("WP投稿URL", "")
          target["最終更新日時"] = result.get("published_at_jst") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          target["エラー内容"] = ""
          with ledger.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print(f"WordPress publish: {status} / post_id={target['WP投稿ID']} / {target['WP投稿URL']}")
          PY

      - name: Commit ledger and eyecatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$PNG_PATH"
          git commit -m "Update IPA guide publish status and eyecatch"
          git pull --rebase
          git push

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-safe-web-guide-publish-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
