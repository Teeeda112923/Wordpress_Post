name: Generate Windows IKE Article Once

on:
  push:
    paths:
      - '.github/workflows/generate-windows-ike-once.yml'

permissions:
  contents: write

concurrency:
  group: cybernote-generate-windows-ike-once
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare
        id: prep
        env:
          ARTICLE_B64: ""
        run: |
          set -euo pipefail
          ARTICLE='projects/cybernote-security-news/articles/windows-ike-cve-2026-33824-kev-rce.md'
          IMAGE='projects/cybernote-security-news/eyecatches/windows-ike-cve-2026-33824-kev-rce.png'
          LEDGER='projects/cybernote-security-news/data/news_ledger.csv'
          CANDIDATES='projects/cybernote-security-news/data/news_candidates.csv'
          git pull --ff-only origin main
          test ! -e "$ARTICLE" && test ! -e "$IMAGE"
          grep -q '20260824-001' "$CANDIDATES"
          ! grep -q 'CVE-2026-33824' "$LEDGER"
          if grep -R -q 'CVE-2026-33824' projects/cybernote-security-news/articles; then exit 1; fi
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path('projects/cybernote-security-news/data/news_ledger.csv').open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          daily=sum(1 for r in rows if r.get('収集日')=='2026-08-24' and r.get('生成ステータス')=='生成済み')
          mx=max([int(r['No']) for r in rows if (r.get('No') or '').isdigit()] or [0])
          print(f'daily_count_before={daily} max_no_before={mx}')
          assert daily < 4
          Path('/tmp/no').write_text(str(mx+1))
          PY
          echo "$ARTICLE_B64" | base64 -d > "$ARTICLE"
          echo "article=$ARTICLE" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "no=$(cat /tmp/no)" >> "$GITHUB_OUTPUT"

      - name: Generate PNG
        run: |
          sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk >/dev/null
          pip install pillow >/dev/null
          python - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          out=Path('${{ steps.prep.outputs.image }}'); img=Image.new('RGB',(1200,800),'#0B1F33'); d=ImageDraw.Draw(img)
          r='/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'; b='/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          d.rounded_rectangle((70,70,1130,730),32,outline='#22D3EE',width=3); d.rounded_rectangle((85,90,315,145),16,fill='#F43F5E')
          d.text((115,101),'実悪用確認・KEV',font=ImageFont.truetype(b,30),fill='white'); d.text((95,205),'Windows IKE',font=ImageFont.truetype(b,68),fill='white')
          d.text((95,300),'CVE-2026-33824',font=ImageFont.truetype(b,58),fill='#22D3EE'); d.text((98,385),'CVSS 9.8  |  認証不要RCE',font=ImageFont.truetype(r,34),fill='#D6E8F5')
          d.line((95,455,1105,455),fill='#334E68',width=2); d.text((95,510),'対処：Windowsを最新の累積更新へ',font=ImageFont.truetype(b,40),fill='#34D399')
          d.text((97,590),'IKE / IPsec利用環境は外部到達性とログも確認',font=ImageFont.truetype(r,34),fill='#D6E8F5'); img.save(out,'PNG',optimize=True)
          raw=out.read_bytes(); assert raw[:8]==b'\x89PNG\r\n\x1a\n'
          with Image.open(out) as im: im.load(); assert im.size==(1200,800) and im.mode=='RGB'
          print(f'PNG OK bytes={out.stat().st_size} size=1200x800 mode=RGB decode=OK')
          PY

      - name: Build temporary ledger
        run: |
          cp projects/cybernote-security-news/data/news_ledger.csv /tmp/ledger.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('/tmp/ledger.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: rd=csv.DictReader(f); fields=rd.fieldnames
          row={k:'' for k in fields}; row.update({'No':'${{ steps.prep.outputs.no }}','収集日':'2026-08-24','公開予定日':'2026-08-24','記事分類':'Windows脆弱性','指定KW':'Windows','話題性スコア':'99','記事タイトル案':'Windows IKE ExtensionのCVE-2026-33824、CISAが実悪用確認','記事タイトル':'【緊急】Windows IKEにCVSS 9.8、CVE-2026-33824の実悪用を確認','スラッグ':'windows-ike-cve-2026-33824-kev-rce','メタディスクリプション':'Windows IKEのCVE-2026-33824を解説。CVSS 9.8、実悪用、対象Windows、更新とIKE/IPsec環境の確認事項をまとめます。','WPカテゴリ':'サイバーセキュリティ','タグ案':'Windows,CVE-2026-33824,IKE,IPsec,リモートコード実行,KEV','記事ファイル':'projects/cybernote-security-news/articles/windows-ike-cve-2026-33824-kev-rce.md','画像ファイル名':'projects/cybernote-security-news/eyecatches/windows-ike-cve-2026-33824-kev-rce.png','主な出典URL':'https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-33824','内部リンクURL':'https://www.cybernote.click/2026/08/12/microsoft-quic-cve-2026-62815-rce/','目標文字数':'1500','生成ステータス':'生成済み','レビュー判定':'未確認','公開停止':'','候補ID':'20260824-001'})
          with p.open('a',encoding='utf-8',newline='') as f: csv.DictWriter(f,fieldnames=fields,lineterminator='\r\n').writerow(row)
          PY

      - name: Measure and run quality gates
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import geo_article_quality_check as g
          md=Path('${{ steps.prep.outputs.article }}').read_text(); front,body,split_err=g.split_front_matter(md)
          faq=g.faq_items(front); src=g.source_items(front); links=g.internal_urls(body); h2=g.h2_sections(body); errors,warnings=g.geo_errors(front,body)
          print('body_core_chars',g.chars(body)); print('intro_chars',g.chars(g.intro_text(body))); print('summary_chars',g.chars(g.summary_text(body))); print('answer_chars',g.chars(g.value_line(front,'answer')))
          print('faq_count',len(faq),'faq_answer_chars',[g.chars(a) for _,a in faq]); print('sources_count',len(src),'primary_count',sum(g.is_primary(u) for _,u,_ in src)); print('internal_links',len(links),'unique',len(set(links)))
          print('reference_boxes',len(re.findall(r'wp:group[^\n]*is-style-information-box',body)),'blogcards',len(re.findall(r'wp:cocoon-blocks/embed-blogcard',body))); print('forbidden_h2',[x for x,_ in h2 if x in g.FORBIDDEN_BODY_H2]); print('summary_count',sum(x=='まとめ' for x,_ in h2)); print('duplicate_headings',g.duplicate_headings(body)); print('list_table_errors',g.list_table_errors(body)); print('errors',errors,'warnings',warnings)
          assert not split_err and not errors and not warnings
          PY
          python article_quality_check.py --input /tmp/ledger.csv --articles-dir projects/cybernote-security-news/articles --results /tmp/article.csv --nos '${{ steps.prep.outputs.no }}' --include-unstarted --mode geo --fail-on-error
          echo article_quality_exit=$?
          python geo_article_quality_check.py --input /tmp/ledger.csv --articles-dir projects/cybernote-security-news/articles --results /tmp/geo.csv --nos '${{ steps.prep.outputs.no }}' --include-unstarted --mode geo --fail-on-error
          echo geo_quality_exit=$?
          cat /tmp/article.csv; cat /tmp/geo.csv

      - name: Commit article and image only
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '${{ steps.prep.outputs.article }}' '${{ steps.prep.outputs.image }}'
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'Add Windows IKE CVE-2026-33824 article'
          git push origin HEAD:main

      - name: Re-fetch and validate remote files
        run: |
          git fetch origin main
          git show origin/main:'${{ steps.prep.outputs.article }}' > /tmp/refetched.md
          git show origin/main:'${{ steps.prep.outputs.image }}' > /tmp/refetched.png
          cmp '${{ steps.prep.outputs.article }}' /tmp/refetched.md; cmp '${{ steps.prep.outputs.image }}' /tmp/refetched.png
          echo article_blob=$(git rev-parse origin/main:'${{ steps.prep.outputs.article }}'); echo image_blob=$(git rev-parse origin/main:'${{ steps.prep.outputs.image }}')
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('/tmp/refetched.png'); assert p.read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          with Image.open(p) as im: im.load(); assert im.size==(1200,800) and im.mode=='RGB'
          print(f'refetched PNG OK bytes={p.stat().st_size} size=1200x800 mode=RGB decode=OK')
          PY

      - name: Append ledger after validation
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('projects/cybernote-security-news/data/news_ledger.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: rd=csv.DictReader(f); fields=rd.fieldnames; rows=list(rd)
          assert not any(r.get('候補ID')=='20260824-001' or r.get('No')=='${{ steps.prep.outputs.no }}' for r in rows)
          row={k:'' for k in fields}; row.update({'No':'${{ steps.prep.outputs.no }}','収集日':'2026-08-24','公開予定日':'2026-08-24','記事分類':'Windows脆弱性','指定KW':'Windows','話題性スコア':'99','記事タイトル案':'Windows IKE ExtensionのCVE-2026-33824、CISAが実悪用確認','記事タイトル':'【緊急】Windows IKEにCVSS 9.8、CVE-2026-33824の実悪用を確認','スラッグ':'windows-ike-cve-2026-33824-kev-rce','メタディスクリプション':'Windows IKEのCVE-2026-33824を解説。CVSS 9.8、実悪用、対象Windows、更新とIKE/IPsec環境の確認事項をまとめます。','WPカテゴリ':'サイバーセキュリティ','タグ案':'Windows,CVE-2026-33824,IKE,IPsec,リモートコード実行,KEV','記事ファイル':'projects/cybernote-security-news/articles/windows-ike-cve-2026-33824-kev-rce.md','画像ファイル名':'projects/cybernote-security-news/eyecatches/windows-ike-cve-2026-33824-kev-rce.png','主な出典URL':'https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-33824','内部リンクURL':'https://www.cybernote.click/2026/08/12/microsoft-quic-cve-2026-62815-rce/','目標文字数':'1500','生成ステータス':'生成済み','レビュー判定':'未確認','公開停止':'','候補ID':'20260824-001'})
          with p.open('a',encoding='utf-8',newline='') as f: csv.DictWriter(f,fieldnames=fields,lineterminator='\r\n').writerow(row)
          PY
          git add -- projects/cybernote-security-news/data/news_ledger.csv
          test "$(git diff --cached --name-only)" = 'projects/cybernote-security-news/data/news_ledger.csv'
          git commit -m 'Record Windows IKE article in ledger'; git push origin HEAD:main

      - name: Final verify and remove workflow
        run: |
          git fetch origin main
          git show origin/main:projects/cybernote-security-news/data/news_ledger.csv | grep '20260824-001'
          echo final_main=$(git rev-parse origin/main); echo ledger_blob=$(git rev-parse origin/main:projects/cybernote-security-news/data/news_ledger.csv); echo article_blob=$(git rev-parse origin/main:'${{ steps.prep.outputs.article }}'); echo image_blob=$(git rev-parse origin/main:'${{ steps.prep.outputs.image }}')
          git pull --ff-only origin main
          git rm -- .github/workflows/generate-windows-ike-once.yml
          git commit -m 'Remove one-shot Windows IKE generation workflow'; git push origin HEAD:main
