name: Certighost One Shot Publisher v3

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: certighost-one-shot-v2
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.issue.title == '[one-shot] Certighost publish v3'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INPUT_FILE: projects/cybernote-security-news/data/certighost_one_shot.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results
      TARGET_NO: "9002"
      SLUG: ad-cs-certighost-cve-2026-54121
    steps:
      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost v3 publish started. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Validate eyecatch
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('projects/cybernote-security-news/eyecatches/ad-cs-certighost-cve-2026-54121.png')
          if not p.exists():
              raise SystemExit(f'missing eyecatch: {p}')
          with Image.open(p) as im:
              im.load()
              print('eyecatch:', im.size, im.mode, p.stat().st_size)
              if im.size != (1200, 800):
                  raise SystemExit(f'unexpected size: {im.size}')
              if im.mode != 'RGB':
                  raise SystemExit(f'unexpected mode: {im.mode}')
          if p.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('invalid PNG signature')
          PY

      - name: GEO article quality gate
        run: |
          python article_quality_check.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/certighost_quality.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input "$INPUT_FILE" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --skip-existing-check \
            --output-dir "$RESULTS_DIR"

      - name: Verify WordPress result
        id: verify
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          files = sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'), key=lambda p: p.stat().st_mtime)
          if not files:
              raise SystemExit('WordPress result CSV not found')
          with files[-1].open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          rows = [r for r in rows if str(r.get('no', '')).strip() == '9002']
          if not rows:
              raise SystemExit('No.9002 result not found')
          r = rows[-1]
          status = (r.get('status') or '').strip().lower()
          post_id = (r.get('post_id') or '').strip()
          post_link = (r.get('post_link') or '').strip()
          print('status:', status)
          print('post_id:', post_id)
          print('post_link:', post_link)
          if status not in {'posted', 'updated'}:
              raise SystemExit(r.get('error_content') or r.get('message') or f'unexpected status: {status}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'post_id={post_id}\n')
              out.write(f'post_link={post_link}\n')
          PY

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          POST_ID: ${{ steps.verify.outputs.post_id }}
          POST_LINK: ${{ steps.verify.outputs.post_link }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost publish succeeded. Post ID: $POST_ID  URL: $POST_LINK"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost publish failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certighost-v3-results
          path: projects/cybernote-security-news/results/*.csv
          if-no-files-found: warn
          retention-days: 7
