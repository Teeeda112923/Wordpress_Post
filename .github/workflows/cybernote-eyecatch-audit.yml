name: CyberNote Eyecatch Audit

on:
  workflow_dispatch:
  schedule:
    # 07:45 JST
    - cron: "45 22 * * *"
  push:
    branches: [main]
    paths:
      - "audit_wp_eyecatches.py"
      - "eyecatch_identity.py"
      - ".github/workflows/cybernote-eyecatch-audit.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit published featured images
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python audit_wp_eyecatches.py             --ledger "$LEDGER"             --images-dir "$IMAGES_DIR"             --output "$RESULTS_DIR/eyecatch_audit.csv"

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-eyecatch-audit
          path: ${{ env.RESULTS_DIR }}/eyecatch_audit.csv
          if-no-files-found: warn
          retention-days: 30
