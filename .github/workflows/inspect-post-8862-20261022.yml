name: Inspect Post 8862 (read-only)
# Read-only check (2026-10-22): confirms whether the server help-page links landed in post 8862 (WordPress PHP guide) and whether the public page still serves the old version. No writes to WordPress.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-post-8862-20261022.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt PyYAML
      - name: Inspect
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os, re, builtins, requests, time
          _out=open('.github/inspect-post-8862-20261022.txt','w',encoding='utf-8')
          def print(*a,**k):
              builtins.print(*a,**k); builtins.print(*a,file=_out)
          from wp_auto_post import WordPressClient
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          p=wp.request('GET','posts/8862',params={'context':'edit'})
          raw=p['content']['raw']; ren=p['content']['rendered']
          print('POST', p['slug'], p['status'], 'modified', p['modified'])
          keys=['xserver.ne.jp','conoha.jp','lolipop.jp','sakura.ad.jp','shin-server.jp']
          for label,txt in [('RAW',raw),('RENDERED',ren)]:
              for u in sorted(set(re.findall(r'href="([^"]+)"',txt))):
                  if any(k in u for k in keys): print(label,'LINK',u)
              print(label,'has_new_sentence', '表のサーバー名のリンク先' in txt)
          url='https://www.cybernote.click/2026/10/22/wordpress-php-version-check-update-guide/'
          for q in ['', '?v=%d'%int(time.time())]:
              r=requests.get(url+q,timeout=30,headers={'User-Agent':'Mozilla/5.0 CyberNote-inspect'})
              h={k:v for k,v in r.headers.items() if k.lower() in ('cf-cache-status','x-litespeed-cache','x-litespeed-cache-control','age','last-modified','cache-control')}
              print('PUBLIC',q or 'plain',r.status_code,h,'new_sentence','表のサーバー名のリンク先' in r.text,'manual_link','man_program_php_ver' in r.text)
          PY
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/inspect-post-8862-20261022.txt
          git commit -m "Record post 8862 inspection output" || exit 0
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 3; done; exit 1
