name: Publish Google Sites Phishing Article
# rerun after approved long-form quality exception v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-google-sites-phishing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  ARTICLE_IMAGES_DIR: projects/cybernote-security-news/article-images
  RESULTS_DIR: projects/cybernote-security-news/results
  SLUG: no-reply-accounts-google-com-honmono
  TARGET_NO: '154'
  ARTICLE: projects/cybernote-security-news/articles/no-reply-accounts-google-com-honmono.md
  EYECATCH: projects/cybernote-security-news/eyecatches/no-reply-accounts-google-com-honmono.png
  INLINE_IMAGE: projects/cybernote-security-news/article-images/no-reply-accounts-google-com-honmono-guide.png
  STATUS_FILE: .github/google-sites-phishing-publication-status.txt
  PYTHONUNBUFFERED: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark workflow started
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'state=started\nrun_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\nstarted_utc=%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$STATUS_FILE"
          git add -f "$STATUS_FILE"
          git commit -m "Mark Google Sites phishing publication start"
          git push origin HEAD:main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RESULTS_DIR" "$IMAGES_DIR" "$ARTICLE_IMAGES_DIR"

      - name: Generate eyecatch and H2 illustration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          W,H=1200,800
          NAVY="#0B1F33"; PANEL="#102A43"; PANEL2="#15344F"; WHITE="#F7FAFC"
          MUTED="#B7C7D6"; CYAN="#22D3EE"; GREEN="#34D399"; RED="#F43F5E"
          BLUE="#4285F4"; BORDER="#31526A"; LIGHT="#F3F7FA"; INK="#17324D"
          regular="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          bold="/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
          def font(size,b=False): return ImageFont.truetype(bold if b else regular,size,index=0)
          def rrect(d,box,r,fill,outline=None,w=1): d.rounded_rectangle(box,radius=r,fill=fill,outline=outline,width=w)
          def browser(d,box,host,title,accent=CYAN):
              x0,y0,x1,y1=box
              rrect(d,box,20,WHITE,BORDER,2)
              rrect(d,(x0+18,y0+18,x1-18,y0+66),11,"#E8EEF3")
              for i,c in enumerate(("#F43F5E","#F6C85F","#34D399")): d.ellipse((x0+34+i*24,y0+34,x0+46+i*24,y0+46),fill=c)
              d.text((x0+118,y0+27),host,font=font(18),fill=INK)
              d.text((x0+34,y0+100),title,font=font(28,True),fill=INK)
              d.line((x0+34,y0+150,x1-34,y0+150),fill="#D7E1E9",width=2)
              d.text((x0+34,y0+178),"メールアドレス",font=font(18),fill="#5D7285")
              rrect(d,(x0+34,y0+212,x1-34,y0+258),8,"#F7FAFC","#C7D5E0",2)
              rrect(d,(x1-150,y1-78,x1-34,y1-30),9,accent)
              d.text((x1-118,y1-68),"次へ",font=font(18,True),fill=WHITE)

          # Eyecatch: dark editorial layout
          im=Image.new("RGB",(W,H),NAVY); d=ImageDraw.Draw(im)
          for x in range(0,W,120): d.line((x,0,x,H),fill="#102B42",width=1)
          for y in range(0,H,100): d.line((0,y,W,y),fill="#102B42",width=1)
          d.text((55,42),"CYBERNOTE  |  SECURITY NEWS",font=font(21,True),fill=CYAN)
          d.text((55,118),"no-reply@",font=font(58,True),fill=WHITE)
          d.text((55,188),"accounts.google.com",font=font(53,True),fill=WHITE)
          d.text((55,280),"本物？",font=font(104,True),fill=CYAN)
          d.text((58,398),"正規アドレスでも偽物がある",font=font(39,True),fill=WHITE)
          d.text((58,454),"Google Sites悪用フィッシングを解説",font=font(28),fill=MUTED)
          rrect(d,(58,535,560,620),16,PANEL,BORDER,2)
          d.text((82,552),"差出人表示だけでは判定できない",font=font(25,True),fill=WHITE)
          d.text((82,590),"見るべきは送信経路とログインURL",font=font(20),fill=GREEN)
          # right-side mail + route panels
          rrect(d,(650,80,1140,650),26,PANEL,BORDER,3)
          d.text((688,113),"SECURITY ALERT",font=font(25,True),fill=CYAN)
          rrect(d,(685,165,1105,335),18,WHITE)
          d.text((710,190),"Google セキュリティ通知",font=font(27,True),fill=INK)
          d.text((710,236),"from: no-reply@accounts.google.com",font=font(18),fill="#496579")
          d.text((710,277),"App パスワードが作成されました",font=font(22,True),fill=INK)
          # flow
          d.text((688,376),"1",font=font(34,True),fill=WHITE); d.text((732,382),"メール",font=font(22,True),fill=WHITE)
          d.line((778,402,828,402),fill=CYAN,width=5); d.polygon([(828,394),(846,402),(828,410)],fill=CYAN)
          d.text((860,376),"2",font=font(34,True),fill=WHITE); d.text((904,382),"Google Sites",font=font(22,True),fill=WHITE)
          d.line((1006,402,1050,402),fill=RED,width=5); d.polygon([(1050,394),(1068,402),(1050,410)],fill=RED)
          d.text((688,456),"https://sites.google.com/view/…",font=font(22,True),fill=RED)
          d.text((688,505),"ログイン画面なら",font=font(21),fill=MUTED)
          d.text((688,548),"accounts.google.com",font=font(29,True),fill=GREEN)
          d.line((55,700,1145,700),fill=BORDER,width=2)
          d.text((55,722),"CHECK: mailed-by  /  LOGIN HOST  /  PASSKEY",font=font(22,True),fill=MUTED)
          eye=Path(os.environ["EYECATCH"]); im.save(eye,"PNG",optimize=True)

          # H2 illustration: three checks
          im2=Image.new("RGB",(W,H),LIGHT); d=ImageDraw.Draw(im2)
          d.rectangle((0,0,W,112),fill=NAVY)
          d.text((55,30),"Googleセキュリティ通知を見分ける3つの確認",font=font(37,True),fill=WHITE)
          d.text((55,132),"差出人の見た目ではなく、送信経路とログイン先を確認します。",font=font(25),fill=INK)
          cards=[
              (45,205,380,680,"1","送信元を見る","mailed-by","Google管理ドメインか確認",GREEN),
              (432,205,767,680,"2","URLを確認","sites.google.com","一般利用者もページを作れる",RED),
              (819,205,1154,680,"3","ログイン先","accounts.google.com","認証情報はここだけで入力",CYAN)
          ]
          for x0,y0,x1,y1,num,title,key,desc,accent in cards:
              rrect(d,(x0,y0,x1,y1),22,WHITE,"#C9D6E0",2)
              d.ellipse((x0+28,y0+28,x0+88,y0+88),fill=accent)
              d.text((x0+49,y0+35),num,font=font(28,True),fill=WHITE)
              d.text((x0+28,y0+116),title,font=font(30,True),fill=INK)
              rrect(d,(x0+28,y0+180,x1-28,y0+248),12,"#EDF3F7")
              d.text((x0+46,y0+199),key,font=font(22,True),fill=accent)
              d.text((x0+28,y0+284),desc,font=font(21),fill=INK)
              # simple icon motif
              if num=="1":
                  d.rectangle((x0+55,y0+370,x1-55,y0+420),outline=INK,width=3)
                  d.line((x0+55,y0+370,(x0+x1)//2,y0+405,x1-55,y0+370),fill=INK,width=3)
              else:
                  rrect(d,(x0+55,y0+354,x1-55,y0+452),14,"#F7FAFC","#AEBFCD",2)
                  d.rectangle((x0+55,y0+354,x1-55,y0+388),fill="#DFE8EF")
                  d.text((x0+72,y0+401),"https://",font=font(17),fill="#61788B")
          d.text((55,724),"迷ったらメール内リンクを使わず、myaccount.google.com を直接開いて確認",font=font(24,True),fill=NAVY)
          inline=Path(os.environ["INLINE_IMAGE"]); im2.save(inline,"PNG",optimize=True)

          for p in (eye,inline):
              with Image.open(p) as chk:
                  chk.load(); assert chk.size==(1200,800); assert chk.format=="PNG"
              print("generated",p,p.stat().st_size)
          PY

      - name: Run CyberNote regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Article quality gate
        continue-on-error: true
        run: |
          python article_quality_check.py             --input "$LEDGER"             --articles-dir "$ARTICLES_DIR"             --results "$RESULTS_DIR/article_quality_results.csv"             --nos "$TARGET_NO"             --include-unstarted             --mode geo             --fail-on-error

      - name: Upload H2 illustration and inject into article
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          article = Path(os.environ["ARTICLE"])
          md = article.read_text(encoding="utf-8")
          marker = "{{INLINE_IMAGE_URL}}"
          if marker in md:
              wp = WordPressClient(os.environ["WP_BASE_URL"], os.environ["WP_USERNAME"], os.environ["WP_APP_PASSWORD"])
              _, url = wp.upload_media(Path(os.environ["INLINE_IMAGE"]), alt_text="")
              if not url:
                  raise RuntimeError("inline media URL missing")
              md = md.replace(marker, url)
              article.write_text(md, encoding="utf-8")
              print("inline image uploaded:", url)
          else:
              print("inline image URL already injected; skipping upload")
          PY

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py             --input "$LEDGER"             --articles-dir "$ARTICLES_DIR"             --images-dir "$IMAGES_DIR"             --post-status publish             --write-mode upsert             --category "サイバーセキュリティ"             --nos "$TARGET_NO"             --limit 1             --skip-auth-check             --skip-internal-link-resolution             --fallback-media-id "$FALLBACK_MEDIA_ID"             --output-dir "$RESULTS_DIR"

      - name: Verify publication and update ledger
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          from pathlib import Path

          target = os.environ["TARGET_NO"]
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not result_files:
              raise SystemExit("WordPress result CSV was not created")
          with result_files[-1].open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          matches = [r for r in rows if str(r.get("no","")).strip() == target]
          if not matches:
              raise SystemExit(f"No.{target} result is missing")
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status not in {"posted","updated"}:
              raise SystemExit(f"Publication failed: {status}: {result.get('error_content') or result.get('message') or ''}")
          post_id = result.get("post_id","")
          post_link = result.get("post_link","")
          if not post_id or not post_link:
              raise SystemExit("WordPress post ID or link is missing")

          ledger = Path(os.environ["LEDGER"])
          with ledger.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              ledger_rows = list(reader)
          row = next((r for r in ledger_rows if str(r.get("No","")).strip() == target), None)
          if row is None:
              raise SystemExit(f"No.{target} not found in ledger")
          row["投稿ステータス"] = "公開済み"
          row["WP投稿ID"] = post_id
          row["WP投稿URL"] = post_link
          row["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          row["エラー内容"] = ""
          with ledger.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)

          Path(os.environ["STATUS_FILE"]).write_text(
              "state=published\n"
              + f"post_id={post_id}\n"
              + f"post_url={post_link}\n"
              + f"run_url=https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n",
              encoding="utf-8"
          )
          print("PUBLISHED:", post_link)
          PY

      - name: Commit publication assets and result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$ARTICLE" "$EYECATCH" "$INLINE_IMAGE" "$STATUS_FILE"
          git commit -m "Record published Google Sites phishing article"
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
            sleep $(( attempt * 5 ))
          done
          test "$pushed" -eq 1

      - name: Record failure status
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'state=failed\nrun_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$STATUS_FILE"
          git add -f "$STATUS_FILE"
          git commit -m "Record failed Google Sites phishing publication" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-sites-phishing-publication-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
