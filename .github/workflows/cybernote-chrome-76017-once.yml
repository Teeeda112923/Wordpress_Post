name: CyberNote Chrome 76017 Once

on:
  push:
    paths:
      - '.github/workflows/cybernote-chrome-76017-once.yml'

permissions:
  contents: write

jobs:
  build-verify-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and Noto fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow

      - name: Build temporary ledger row
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src = Path('projects/cybernote-security-news/data/news_ledger.csv')
          dst = Path('/tmp/news_ledger_check.csv')
          with src.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)
          todays = [r for r in rows if r.get('公開予定日') == '2026-08-23' and r.get('生成ステータス') == '生成済み']
          if len(todays) >= 4:
              raise SystemExit('daily generation limit reached')
          row = {k: '' for k in fields}
          row.update({
              'No':'60','収集日':'2026-08-23','公開予定日':'2026-08-23','記事分類':'ブラウザー脆弱性','指定KW':'Google Chrome','話題性スコア':'99',
              '記事タイトル案':'Google Chrome 151の追加更新でCritical 1件を含む7件を修正',
              '記事タイトル':'【重要】Google Chrome 151にCritical脆弱性、最新版へ更新を',
              'スラッグ':'google-chrome-151-cve-2026-76017-76023-update',
              'メタディスクリプション':'Google Chrome 151のCVE-2026-76017を解説。CVSS 8.8、対象版、更新方法と悪用状況をまとめます。',
              'WPカテゴリ':'サイバーセキュリティ','タグ案':'Google Chrome,CVE-2026-76017,CVE-2026-76023,Chromoting,セキュリティ更新',
              '記事ファイル':'projects/cybernote-security-news/articles/google-chrome-151-cve-2026-76017-76023-update.md',
              '画像ファイル名':'projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png',
              '主な出典URL':'https://chromereleases.googleblog.com/2026/08/stable-channel-update-for-desktop_0404570826.html',
              '内部リンクURL':'https://www.cybernote.click/2026/08/20/google-chrome-151-cve-2026-76034-76036-update/',
              '目標文字数':'1500','生成ステータス':'生成済み','レビュー判定':'未確認','公開停止':'','候補ID':'20260823-003'
          })
          with dst.open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader(); w.writerows(rows + [row])
          PY

      - name: Article quality check
        run: |
          python article_quality_check.py \
            --input /tmp/news_ledger_check.csv \
            --articles-dir projects/cybernote-security-news/articles \
            --results /tmp/article_quality_results.csv \
            --nos 60 \
            --include-unstarted \
            --mode geo \
            --fail-on-error
          echo "article_quality_check_exit=0"

      - name: GEO quality check
        run: |
          python geo_article_quality_check.py \
            --input /tmp/news_ledger_check.csv \
            --articles-dir projects/cybernote-security-news/articles \
            --results /tmp/geo_article_quality_results.csv \
            --nos 60 \
            --include-unstarted \
            --mode geo \
            --fail-on-error
          echo "geo_article_quality_check_exit=0"
          cat /tmp/geo_article_quality_results.csv

      - name: Generate eyecatch
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          out = Path('projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png')
          out.parent.mkdir(parents=True, exist_ok=True)
          img = Image.new('RGB', (1200, 800), '#0B1F33')
          d = ImageDraw.Draw(img)
          font_path = '/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc'
          bold_path = '/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc'
          if not Path(bold_path).exists(): bold_path = font_path
          title = ImageFont.truetype(bold_path, 72)
          cve = ImageFont.truetype(bold_path, 54)
          body = ImageFont.truetype(font_path, 38)
          small = ImageFont.truetype(font_path, 28)
          d.rounded_rectangle((70, 70, 1130, 730), radius=28, outline='#22D3EE', width=4)
          d.text((110, 120), 'Google Chrome 151', font=title, fill='#F8FAFC')
          d.text((110, 250), 'CVE-2026-76017', font=cve, fill='#22D3EE')
          d.text((110, 330), 'Critical / CVSS 8.8', font=body, fill='#F8FAFC')
          d.rounded_rectangle((110, 445, 1090, 585), radius=18, fill='#102A43')
          d.text((150, 485), '対処：Chromeを最新版へ更新', font=body, fill='#F8FAFC')
          d.text((110, 650), 'CyberNote  |  2026.08', font=small, fill='#AFC7D9')
          img.save(out, 'PNG', optimize=True)
          PY

      - name: Validate eyecatch before save
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p = Path('projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png')
          b = p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n', 'invalid PNG signature'
          with Image.open(p) as im:
              im.load()
              assert im.size == (1200, 800), im.size
              assert im.mode == 'RGB', im.mode
          assert p.stat().st_size > 10000, p.stat().st_size
          print(f'PNG_OK size={p.stat().st_size} dimensions=1200x800 mode=RGB')
          PY

      - name: Commit PNG only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png
          git commit -m 'Add Chrome CVE-2026-76017 eyecatch'
          git push origin HEAD:main

      - name: Re-fetch and verify article and PNG
        run: |
          git fetch origin main
          ARTICLE='projects/cybernote-security-news/articles/google-chrome-151-cve-2026-76017-76023-update.md'
          IMAGE='projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png'
          git show origin/main:"$ARTICLE" > /tmp/github-article.md
          git show origin/main:"$IMAGE" > /tmp/github-image.png
          cmp -s "$ARTICLE" /tmp/github-article.md
          cmp -s "$IMAGE" /tmp/github-image.png
          echo "article_blob_sha=$(git rev-parse origin/main:$ARTICLE)"
          echo "image_blob_sha=$(git rev-parse origin/main:$IMAGE)"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('/tmp/github-image.png'); b=p.read_bytes()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          with Image.open(p) as im:
              im.load(); assert im.size==(1200,800); assert im.mode=='RGB'
          print(f'GITHUB_PNG_OK size={p.stat().st_size} dimensions=1200x800 mode=RGB')
          PY

      - name: Append ledger only after verification
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('projects/cybernote-security-news/data/news_ledger.csv')
          with path.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; rows=list(reader)
          assert not any(r.get('候補ID')=='20260823-003' or r.get('No')=='60' for r in rows)
          row={k:'' for k in fields}
          row.update({'No':'60','収集日':'2026-08-23','公開予定日':'2026-08-23','記事分類':'ブラウザー脆弱性','指定KW':'Google Chrome','話題性スコア':'99','記事タイトル案':'Google Chrome 151の追加更新でCritical 1件を含む7件を修正','記事タイトル':'【重要】Google Chrome 151にCritical脆弱性、最新版へ更新を','スラッグ':'google-chrome-151-cve-2026-76017-76023-update','メタディスクリプション':'Google Chrome 151のCVE-2026-76017を解説。CVSS 8.8、対象版、更新方法と悪用状況をまとめます。','WPカテゴリ':'サイバーセキュリティ','タグ案':'Google Chrome,CVE-2026-76017,CVE-2026-76023,Chromoting,セキュリティ更新','記事ファイル':'projects/cybernote-security-news/articles/google-chrome-151-cve-2026-76017-76023-update.md','画像ファイル名':'projects/cybernote-security-news/eyecatches/google-chrome-151-cve-2026-76017-76023-update.png','主な出典URL':'https://chromereleases.googleblog.com/2026/08/stable-channel-update-for-desktop_0404570826.html','内部リンクURL':'https://www.cybernote.click/2026/08/20/google-chrome-151-cve-2026-76034-76036-update/','目標文字数':'1500','生成ステータス':'生成済み','レビュー判定':'未確認','公開停止':'','候補ID':'20260823-003'})
          with path.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(rows+[row])
          PY
          git rm -- .github/workflows/cybernote-chrome-76017-once.yml
          git add -- projects/cybernote-security-news/data/news_ledger.csv
          git commit -m 'Record Chrome CVE-2026-76017 article'
          git push origin HEAD:main
