name: Publish ai-affiliate-saishin-2026 2026-11-24
# User-approved article (2026-11-24). Push of this file publishes No.361 ai-affiliate-saishin-2026 (no affiliate tag).
# Uploads three CyberNote-made charts (data: JAO / Pew Research Center / 国民生活センター) and injects their URLs before publishing.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-ai-affiliate-saishin-20261124.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news-fast-publish
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NOS: '361'
  SLUGS: 'ai-affiliate-saishin-2026'
  AFFILIATE_SLUGS: ''
  ARTICLE: projects/cybernote-security-news/articles/ai-affiliate-saishin-2026.md
  INLINE_DIR: projects/cybernote-security-news/article-images
  INLINE_KEYS: 'tsuki3man,ai-click,business-kouza'
  STATUS_FILE: .github/ai-affiliate-saishin-20261124-publication-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '1'
  WP_SERVER_ERROR_RETRY_COUNT: '2'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML
          mkdir -p "$RESULTS_DIR"

      - name: Verify selected eyecatch identity
        run: |
          python verify_eyecatch_identity.py \
            --ledger "$LEDGER" \
            --images-dir "$IMAGES_DIR" \
            --nos "$TARGET_NOS" \
            --require-from-no 147

      - name: Verify long-form article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml, os
          for slug in os.environ['SLUGS'].split(','):
            p=Path(os.environ['ARTICLES_DIR'])/(slug+'.md')
            text=p.read_text(encoding='utf-8')
            m=re.match(r'^---\s*\n(.*?)\n---\s*\n(.*)$',text,re.S)
            if not m:
                raise SystemExit('front matter missing')
            meta=yaml.safe_load(m.group(1)) or {}
            body=m.group(2)
            if not str(meta.get('answer') or '').strip().endswith('。'):
                raise SystemExit('answer missing')
            if len(meta.get('faq') or []) < 2:
                raise SystemExit('faq incomplete')
            if len(meta.get('sources') or []) < 1:
                raise SystemExit('sources incomplete')
            if '## まとめ' not in body:
                raise SystemExit('summary section missing')
            for banned in ('WEB完結','営業電話がない','営業電話なし'):
                if banned in body:
                    raise SystemExit(f'prohibited claim for poimitsu: {banned}')
            if slug in os.environ['AFFILIATE_SLUGS'].split(',') and 'px.a8.net' not in body:
                raise SystemExit(f'affiliate tag missing: {slug}')
            if re.search(r'cybernote\.click/(?!20\d\d/)[a-z0-9-]+/', body):
                raise SystemExit(f'slug-only internal link: {slug}')
          print('User-supplied article accepted by explicit user instruction.')
          PY

      - name: Run regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Upload inline charts and inject URLs
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from wp_auto_post import WordPressClient
          article=Path(os.environ["ARTICLE"]); md=article.read_text(encoding="utf-8")
          alts={"tsuki3man":"アフィリエイトで月3万円以上稼ぐ人の割合（日本アフィリエイト協議会）",
                "ai-click":"Google検索で通常の検索結果をクリックした割合（Pew Research Center）",
                "business-kouza":"ビジネス講座に関する相談件数の推移（国民生活センター）"}
          wp=WordPressClient(os.environ["WP_BASE_URL"],os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          for key in os.environ["INLINE_KEYS"].split(","):
              marker="{{INLINE_IMAGE_URL:"+key+"}}"
              if marker not in md:
                  print("already injected:", key); continue
              img=Path(os.environ["INLINE_DIR"])/f"ai-affiliate-saishin-2026-{key}.png"
              _, url=wp.upload_media(img, alt_text=alts[key])
              if not url: raise RuntimeError(f"inline media URL missing: {key}")
              md=md.replace(marker,url); print("inline image uploaded:", url)
          if "{{INLINE_IMAGE_URL" in md: raise SystemExit("unresolved inline image marker")
          article.write_text(md,encoding="utf-8")
          PY

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NOS" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify publication and update ledger
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv, datetime as dt, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          nos=os.environ['TARGET_NOS'].split(','); slugs=os.environ['SLUGS'].split(',')
          files=sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'))
          if not files: raise SystemExit('result CSV missing')
          with files[-1].open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          ledger=Path(os.environ['LEDGER'])
          with ledger.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; data=list(reader)
          status_lines=['state=published']
          for no,slug in zip(nos,slugs):
              matches=[r for r in rows if str(r.get('no','')).strip()==no]
              if not matches: raise SystemExit(f'target result missing: {no}')
              result=matches[-1]
              status=(result.get('status') or '').strip().lower()
              if status!='posted':
                  raise SystemExit(f"publication failed No.{no}: {status}: {result.get('error_content') or result.get('message') or ''}")
              post_id=int(result.get('post_id') or 0); post_url=result.get('post_link') or ''
              if not post_id or not post_url: raise SystemExit(f'post id/url missing: {no}')
              post=wp.request('GET',f'posts/{post_id}',params={'context':'edit'})
              if post.get('status')!='publish': raise SystemExit(f"unexpected post status No.{no}: {post.get('status')}")
              raw=str((post.get('content') or {}).get('raw') or '')
              if slug in os.environ['AFFILIATE_SLUGS'].split(',') and 'px.a8.net' not in raw: raise SystemExit(f'affiliate tag lost No.{no}')
              for key in os.environ['INLINE_KEYS'].split(','):
                  if f'ai-affiliate-saishin-2026-{key}' not in raw: raise SystemExit(f'inline chart missing No.{no}: {key}')
              media_id=int(post.get('featured_media') or 0)
              if not media_id: raise SystemExit(f'featured media missing: {no}')
              media=wp.request('GET',f'media/{media_id}',params={'context':'edit'})
              media_source=str(media.get('source_url') or '')
              if slug not in media_source: raise SystemExit(f'eyecatch mismatch No.{no}: {media_source}')
              meta=post.get('meta') or {}
              missing=[k for k in ['_cng_answer','_cng_faq','_cng_sources'] if not meta.get(k)]
              if missing: raise SystemExit(f'GEO metadata missing No.{no}: '+','.join(missing))
              for row in data:
                  if str(row.get('No','')).strip()==no:
                      row['投稿ステータス']='公開済み'; row['WP投稿ID']=str(post_id); row['WP投稿URL']=post_url
                      row['最終更新日時']=dt.datetime.now().strftime('%Y-%m-%d %H:%M:%S'); row['エラー内容']=''
                      break
              else:
                  raise SystemExit(f'ledger row missing: {no}')
              status_lines.append(f'no{no}_post_id={post_id}\nno{no}_post_url={post_url}\nno{no}_media={media_source}')
              print(post_url)
          with ledger.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(data)
          status_lines.append(f"run_url=https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}")
          Path(os.environ['STATUS_FILE']).write_text('\n'.join(status_lines)+'\n',encoding='utf-8')
          PY

      - name: Commit publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$ARTICLE" "$STATUS_FILE"
          git commit -m "Record ai-affiliate-saishin-2026 publication" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-affiliate-saishin-20261124-publication-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 14
