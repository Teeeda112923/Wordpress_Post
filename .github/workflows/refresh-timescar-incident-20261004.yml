name: Refresh Times Car Incident 2026-10-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-timescar-incident-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timescar-refresh-20261004
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NO: '141'
  SLUG: timescar-unauthorized-access-data-leak-2026
  STATUS_FILE: .github/timescar-refresh-20261004-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '0'
  WP_SERVER_ERROR_RETRY_COUNT: '0'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Mark refresh started
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'state=started\nrun_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$STATUS_FILE"
          git add -f "$STATUS_FILE"
          git commit -m "Mark Times Car refresh start"
          git push origin HEAD:main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p "$RESULTS_DIR"

      - name: Validate article and existing eyecatch
        run: |
          test -s "$IMAGES_DIR/$SLUG.png"
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Update existing WordPress post
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify live post and GEO metadata
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          target=os.environ['TARGET_NO']
          files=sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'))
          if not files:
              raise SystemExit('result CSV missing')
          with files[-1].open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          matches=[r for r in rows if str(r.get('no','')).strip()==target]
          if not matches:
              raise SystemExit('target result missing')
          result=matches[-1]
          if (result.get('status') or '').strip().lower() not in {'posted','updated'}:
              raise SystemExit(f"update failed: {result}")
          post_id=int(result.get('post_id') or 0)
          link=result.get('post_link') or ''
          if post_id != 8380:
              raise SystemExit(f'unexpected post id: {post_id}')

          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          post=wp.request('GET',f'posts/{post_id}',params={'context':'edit'})
          if os.environ['SLUG'] not in str(post.get('slug') or ''):
              raise SystemExit(f"slug mismatch: {post.get('slug')}")
          media_id=int(post.get('featured_media') or 0)
          if not media_id:
              raise SystemExit('featured media missing')
          media=wp.request('GET',f'media/{media_id}',params={'context':'edit'})
          source=str(media.get('source_url') or '')
          if os.environ['SLUG'] not in source:
              raise SystemExit(f'eyecatch mismatch: {source}')

          meta=post.get('meta') or {}
          required=['_cng_answer','_cng_faq','_cng_sources']
          missing=[k for k in required if not meta.get(k)]
          if missing:
              raise SystemExit('GEO metadata missing: '+','.join(missing))
          faq=json.loads(meta['_cng_faq']) if isinstance(meta['_cng_faq'],str) else meta['_cng_faq']
          sources=json.loads(meta['_cng_sources']) if isinstance(meta['_cng_sources'],str) else meta['_cng_sources']
          if len(faq)<3 or len(sources)<5:
              raise SystemExit(f'GEO metadata incomplete: faq={len(faq)} sources={len(sources)}')

          Path(os.environ['STATUS_FILE']).write_text(
              'state=published\n'
              +f'post_id={post_id}\n'
              +f'post_url={link}\n'
              +f'featured_media={media_id}\n'
              +f'media_source={source}\n'
              +f'geo_faq={len(faq)}\n'
              +f'geo_sources={len(sources)}\n'
              +f'run_url=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n',
              encoding='utf-8'
          )
          print('UPDATED:',link)
          PY

      - name: Commit refresh result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$STATUS_FILE"
          git commit -m "Record refreshed Times Car incident" || true
          git pull --rebase origin main || true
          git push origin HEAD:main
