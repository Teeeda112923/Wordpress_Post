name: Record Oracle EBS Article Once

on:
  push:
    branches:
      - automation/oracle-ebs-20260821
    paths:
      - .github/workflows/oracle-ebs-validate.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Verify main article and image
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          article=Path('projects/cybernote-security-news/articles/oracle-e-business-suite-cve-2026-60782-70926-cspu-august-2026.md')
          image=Path('projects/cybernote-security-news/eyecatches/oracle-e-business-suite-cve-2026-60782-70926-cspu-august-2026.png')
          assert article.exists() and image.exists()
          assert image.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          with Image.open(image) as im:
              im.load()
              assert im.size == (1200,800), im.size
              assert im.mode == 'RGB', im.mode
          print(f'MAIN_ASSETS_OK image_size={image.stat().st_size}')
          PY
      - name: Append No.57 ledger row
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          path=Path('projects/cybernote-security-news/data/news_ledger.csv')
          with path.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames or []; rows=list(reader)
          if any(str(r.get('No','')).strip()=='57' for r in rows):
              raise SystemExit('No.57 already exists')
          row={k:'' for k in fields}
          row.update({
              'No':'57','収集日':'2026-08-21','公開予定日':'2026-08-21','記事分類':'ERP脆弱性',
              '指定KW':'Oracle E-Business Suite','話題性スコア':'95',
              '記事タイトル案':'Oracle E-Business Suiteの8月CSPU、CVSS 9.8の認証不要脆弱性2件を修正',
              '記事タイトル':'【重要】Oracle E-Business SuiteにCVSS 9.8、8月CSPUを適用',
              'スラッグ':'oracle-e-business-suite-cve-2026-60782-70926-cspu-august-2026',
              'メタディスクリプション':'Oracle E-Business Suiteの2026年8月CSPUを解説。CVE-2026-60782とCVE-2026-70926の影響、対象版、対策をまとめます。',
              'WPカテゴリ':'サイバーセキュリティ','タグ案':'Oracle E-Business Suite,CVE-2026-60782,CVE-2026-70926,CSPU,脆弱性',
              '記事ファイル':'projects/cybernote-security-news/articles/oracle-e-business-suite-cve-2026-60782-70926-cspu-august-2026.md',
              '画像ファイル名':'projects/cybernote-security-news/eyecatches/oracle-e-business-suite-cve-2026-60782-70926-cspu-august-2026.png',
              '主な出典URL':'https://www.oracle.com/security-alerts/cspuaug2026.html',
              '内部リンクURL':'https://www.cybernote.click/2026/07/28/oracle-java-security-update-july-2026/',
              '目標文字数':'1500','生成ステータス':'生成済み','レビュー判定':'未確認','公開停止':'','候補ID':'20260821-002'
          })
          rows.append(row)
          with path.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)
          print('LEDGER_NO57_APPENDED')
          PY
      - name: Commit ledger only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- projects/cybernote-security-news/data/news_ledger.csv
          git commit -m "Record Oracle E-Business Suite article"
          git push origin HEAD:main
