name: Refresh GitLab CVE-2026-97229 and Cisco CVE-2026-76418 articles (KEV) 2026-11-04
# User-approved update (2026-11-04): adds CISA KEV listing and confirmed exploitation to posts 8637 (No.182) and 9122 (No.266); keeps slug, URL and eyecatch.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-kev-gitlab-cisco-20261104.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news-fast-publish
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NOS: '182,266'
  STATUS_FILE: .github/kev-gitlab-cisco-refresh-20261104-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '1'
  WP_SERVER_ERROR_RETRY_COUNT: '2'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML
          mkdir -p "$RESULTS_DIR"

      - name: Verify eyecatches exist
        run: |
          test -s "$IMAGES_DIR/gitlab-cve-2026-97229-ci-cd-regex-rce-update.png"
          test -s "$IMAGES_DIR/cisco-asa-ftd-cve-2026-76418-ssl-vpn-secondary-auth-dos-exploited.png"

      - name: Run regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Update existing WordPress post
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NOS" \
            --limit 2 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify live post and GEO metadata
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          expected={'182':(8637,'gitlab-cve-2026-97229-ci-cd-regex-rce-update'),'266':(9122,'cisco-asa-ftd-cve-2026-76418-ssl-vpn-secondary-auth-dos-exploited')}
          files=sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'))
          if not files:
              raise SystemExit('result CSV missing')
          with files[-1].open(encoding='utf-8-sig', newline='') as f:
              rows=list(csv.DictReader(f))
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          out=[]
          for target,(want_id,slug) in expected.items():
              matches=[r for r in rows if str(r.get('no','')).strip()==target]
              if not matches:
                  raise SystemExit(f'target result missing: {target}')
              result=matches[-1]
              if (result.get('status') or '').strip().lower() not in {'posted','updated'}:
                  raise SystemExit(f"update failed: {result}")
              post_id=int(result.get('post_id') or 0)
              link=result.get('post_link') or ''
              if post_id != want_id:
                  raise SystemExit(f'unexpected post id: {post_id} (no {target})')
              post=wp.request('GET',f'posts/{post_id}',params={'context':'edit'})
              if post.get('status')!='publish':
                  raise SystemExit(f"unexpected post status: {post.get('status')}")
              if slug not in str(post.get('slug') or ''):
                  raise SystemExit(f"slug mismatch: {post.get('slug')}")
              media_id=int(post.get('featured_media') or 0)
              if not media_id:
                  raise SystemExit('featured media missing')
              media=wp.request('GET',f'media/{media_id}',params={'context':'edit'})
              source=str(media.get('source_url') or '')
              if slug not in source:
                  raise SystemExit(f'eyecatch mismatch: {source}')
              meta=post.get('meta') or {}
              missing=[k for k in ['_cng_answer','_cng_faq','_cng_sources'] if not meta.get(k)]
              if missing:
                  raise SystemExit('GEO metadata missing: '+','.join(missing))
              if 'KEV' not in str(post.get('content',{}).get('raw','')):
                  raise SystemExit(f'KEV text missing in live post {post_id}')
              out.append(f'no{target}_post_id={post_id}\nno{target}_post_url={link}\nno{target}_media={source}\n')
              print('UPDATED:',link)
          Path(os.environ['STATUS_FILE']).write_text(
              'state=published\n'+''.join(out)
              +f'run_url=https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}\n',
              encoding='utf-8')
          PY

      - name: Commit refresh result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$STATUS_FILE"
          git commit -m "Record refreshed GitLab CVE-2026-97229 and Cisco CVE-2026-76418 articles (KEV)" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          POST_URL: https://www.cybernote.click/2026/10/13/gitlab-cve-2026-97229-ci-cd-regex-rce-update/
          POST_URL2: https://www.cybernote.click/2026/10/30/cisco-asa-ftd-cve-2026-76418-ssl-vpn-secondary-auth-dos-exploited/
        run: |
          python - <<'PY'
          import os, sys, requests
          token = os.environ.get("CLOUDFLARE_API_TOKEN") or os.environ.get("CF_API_TOKEN") or ""
          zone = os.environ.get("CLOUDFLARE_ZONE_ID") or os.environ.get("CF_ZONE_ID") or ""
          if not (token and zone):
              print("::warning title=Cloudflareキャッシュ未削除::APIトークンまたはゾーンIDのシークレットがありません")
              sys.exit(0)
          files = [os.environ["POST_URL"], os.environ["POST_URL2"], "https://www.cybernote.click/", "https://www.cybernote.click/feed/"]
          r = requests.post(f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
                            headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
                            json={"files": files}, timeout=60)
          ok = r.ok and (r.json() or {}).get("success") is True
          print("CLOUDFLARE_PURGE_SUCCESS=", ok)
          if not ok:
              print("::warning title=Cloudflareキャッシュ削除失敗::" + r.text[:200]); sys.exit(1)
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-cve-2026-110264-refresh-20261022-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 14
