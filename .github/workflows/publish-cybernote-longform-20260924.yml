name: Publish CyberNote Longform Batch 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - projects/cybernote-security-news/.publish-20260924-longform-batch

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  IMPORT_B64: projects/cybernote-security-news/src/import_longform_batch_20260924.py.gz.b64

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Build seven approved longform articles and eyecatches
        run: |
          base64 -d "$IMPORT_B64" | gzip -d > /tmp/import_longform_batch_20260924.py
          python -m py_compile /tmp/import_longform_batch_20260924.py
          cp /tmp/import_longform_batch_20260924.py projects/cybernote-security-news/src/import_longform_batch_20260924.py
          python projects/cybernote-security-news/src/import_longform_batch_20260924.py
          echo "Target Nos: $(cat "$RESULTS_DIR/longform_batch_nos.txt")"

      - name: Commit prepared articles, images and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARTICLES_DIR" "$IMAGES_DIR" "$LEDGER"
          git add projects/cybernote-security-news/src/import_longform_batch_20260924.py
          if git diff --cached --quiet; then
            echo "生成物に変更なし"
          else
            git commit -m "Prepare seven CyberNote longform articles"
            git push
          fi

      - name: Publish all seven to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          NOS="$(cat "$RESULTS_DIR/longform_batch_nos.txt")"
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$NOS" \
            --limit 7 \
            --sleep 180 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Validate WordPress results and update ledger
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          from pathlib import Path

          ledger_path = Path("projects/cybernote-security-news/data/news_ledger.csv")
          results_dir = Path("projects/cybernote-security-news/results")
          wanted = [x.strip() for x in (results_dir / "longform_batch_nos.txt").read_text(encoding="utf-8").split(",") if x.strip()]
          result_files = sorted(results_dir.glob("results_*.csv"))
          if not result_files:
              raise SystemExit("投稿結果CSVが見つかりません")
          with result_files[-1].open(encoding="utf-8-sig", newline="") as f:
              results = {str(r.get("no", "")).strip(): r for r in csv.DictReader(f)}
          failed = []
          for no in wanted:
              row = results.get(no)
              status = (row.get("status") or "").strip().lower() if row else ""
              if status not in {"posted", "updated"}:
                  failed.append(f"No.{no}: {(row or {}).get('error_content') or (row or {}).get('message') or status or '結果なし'}")
          if failed:
              raise SystemExit("\n".join(failed))

          with ledger_path.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames or []
              rows = list(reader)
          now = dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          for row in rows:
              no = str(row.get("No", "")).strip()
              if no not in results or no not in wanted:
                  continue
              result = results[no]
              row["投稿ステータス"] = "公開済み"
              row["WP投稿ID"] = result.get("post_id", "")
              row["WP投稿URL"] = result.get("post_link", "")
              row["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or now
              row["エラー内容"] = ""
          with ledger_path.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(rows)
          print("公開完了:", ",".join(wanted))
          PY

          git add "$LEDGER"
          git commit -m "Update CyberNote publish status for seven longform articles"
          git push

      - name: Confirm all seven published
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          wanted = [x.strip() for x in Path("projects/cybernote-security-news/results/longform_batch_nos.txt").read_text().split(",") if x.strip()]
          with Path("projects/cybernote-security-news/data/news_ledger.csv").open(encoding="utf-8-sig", newline="") as f:
              rows = {str(r.get("No", "")).strip(): r for r in csv.DictReader(f)}
          failed = []
          for no in wanted:
              row = rows.get(no, {})
              print(f"No.{no}: {row.get('投稿ステータス','')} {row.get('WP投稿URL','')}")
              if row.get("投稿ステータス") != "公開済み" or not row.get("WP投稿URL"):
                  failed.append(no)
          if failed:
              raise SystemExit("未完了: " + ",".join(failed))
          PY

      - name: Remove one-off batch machinery
        run: |
          git rm -f .github/workflows/publish-cybernote-longform-20260924.yml
          git rm -f projects/cybernote-security-news/.publish-20260924-longform-batch
          git rm -f projects/cybernote-security-news/src/import_longform_batch_20260924.py.gz.b64
          git rm -f projects/cybernote-security-news/src/import_longform_batch_20260924.py
          git rm -rf projects/cybernote-security-news/incoming/2026-09-24
          git commit -m "Remove completed CyberNote longform batch machinery"
          git push
