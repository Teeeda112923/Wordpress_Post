name: Correct CyberNote Eyecatches 2026-09-25

on:
  push:
    branches: [main]
    paths:
      - projects/cybernote-security-news/.correct-eyecatches-20260925

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  PAYLOAD_DIR: projects/cybernote-security-news/tmp/eyecatch-fix-20260925
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  ARTICLES_DIR: projects/cybernote-security-news/articles
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Restore approved source photos
        run: |
          mkdir -p /tmp/eyecatchsrc
          cat "$PAYLOAD_DIR"/part*.b64 | base64 -d > /tmp/eyefix.tar
          tar -xf /tmp/eyefix.tar -C /tmp/eyecatchsrc
          ls -lh /tmp/eyecatchsrc

      - name: Rebuild the seven approved eyecatches
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw, ImageFont

          src = Path("/tmp/eyecatchsrc")
          out = Path("projects/cybernote-security-news/eyecatches")
          out.mkdir(parents=True, exist_ok=True)

          font = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          items = [
              ("preview_01.jpg", "digital-agency-gss-vpn-vulnerability.png", "デジタル庁GSS", "VPNの脆弱性を悪用"),
              ("preview_02.jpg", "ai-agent-security-openai-australia-medicare.png", "AIエージェント", "豪政府サイトへの不正アクセス"),
              ("preview_03.jpg", "windows-zero-day-patch-tuesday-2026-09.png", "Windows Update", "9月のゼロデイ脆弱性"),
              ("preview_04.jpg", "d-link-dir-822a-router-zero-day.png", "D-Link DIR-822A", "ルーターに重大な脆弱性"),
              ("preview_05.jpg", "eviltokens-microsoft-account-takeover.png", "Microsoft 365", "EvilTokensによる乗っ取り"),
              ("preview_06.jpg", "google-gdpr-fine-location-data.png", "Google・GDPR", "位置情報処理への制裁金"),
              ("preview_07.jpg", "supply-chain-attack-npm-crowdsec.png", "npm・CrowdSec", "サプライチェーン攻撃"),
          ]

          navy = (11, 31, 51)
          cyan = (34, 211, 238)
          white = (247, 250, 252)
          muted = (166, 187, 207)

          for src_name, filename, kicker, title in items:
              photo = Image.open(src / src_name).convert("RGB")
              canvas = Image.new("RGB", (1200, 800), navy)
              top = ImageOps.fit(photo, (1200, 550), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
              canvas.paste(top, (0, 0))
              draw = ImageDraw.Draw(canvas)

              kicker_font = ImageFont.truetype(font, 34)
              title_font = ImageFont.truetype(font, 62)
              footer_font = ImageFont.truetype(font, 23)

              draw.rectangle((55, 589, 68, 622), fill=cyan)
              draw.text((88, 582), kicker, font=kicker_font, fill=cyan)
              draw.text((54, 654), title, font=title_font, fill=white)
              draw.text((55, 754), "CYBERNOTE  /  SECURITY NEWS", font=footer_font, fill=muted)

              target = out / filename
              canvas.save(target, "PNG", optimize=True)

              with Image.open(target) as check:
                  check.load()
                  assert check.format == "PNG"
                  assert check.size == (1200, 800)
                  assert check.mode == "RGB"
              print("[OK]", target)

          PY

      - name: Commit corrected eyecatches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$IMAGES_DIR"/digital-agency-gss-vpn-vulnerability.png
          git add "$IMAGES_DIR"/ai-agent-security-openai-australia-medicare.png
          git add "$IMAGES_DIR"/windows-zero-day-patch-tuesday-2026-09.png
          git add "$IMAGES_DIR"/d-link-dir-822a-router-zero-day.png
          git add "$IMAGES_DIR"/eviltokens-microsoft-account-takeover.png
          git add "$IMAGES_DIR"/google-gdpr-fine-location-data.png
          git add "$IMAGES_DIR"/supply-chain-attack-npm-crowdsec.png
          git commit -m "Replace seven CyberNote eyecatches with approved originals"
          git push

      - name: Re-upload corrected featured images to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py             --input "$LEDGER"             --articles-dir "$ARTICLES_DIR"             --images-dir "$IMAGES_DIR"             --post-status publish             --write-mode upsert             --category "サイバーセキュリティ"             --nos "123,124,125,126,127,128,129"             --limit 7             --sleep 180             --skip-auth-check             --skip-internal-link-resolution             --fallback-media-id "$FALLBACK_MEDIA_ID"             --output-dir "$RESULTS_DIR"

      - name: Verify seven updates
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          wanted = {"123","124","125","126","127","128","129"}
          files = sorted(Path("projects/cybernote-security-news/results").glob("results_*.csv"))
          if not files:
              raise SystemExit("投稿結果CSVが見つかりません")
          with files[-1].open(encoding="utf-8-sig", newline="") as f:
              rows = {str(r.get("no","")).strip(): r for r in csv.DictReader(f)}
          failed = []
          for no in sorted(wanted, key=int):
              row = rows.get(no)
              status = (row.get("status") or "").strip().lower() if row else ""
              image_status = (row.get("image_status") or "").strip() if row else ""
              print(f"No.{no}: {status} image={image_status}")
              if status not in {"updated","posted"}:
                  failed.append(no)
              if "代替" in image_status:
                  failed.append(no + "(fallback)")
          if failed:
              raise SystemExit("更新失敗: " + ",".join(failed))
          PY

      - name: Clean one-off correction machinery
        if: success()
        run: |
          git pull --rebase origin main
          git rm -f .github/workflows/correct-cybernote-eyecatches-20260925.yml
          git rm -f projects/cybernote-security-news/.correct-eyecatches-20260925
          git rm -rf "$PAYLOAD_DIR"
          git commit -m "Remove completed eyecatch correction machinery"
          git push
