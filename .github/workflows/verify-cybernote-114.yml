name: Verify CyberNote No114
on:
  push:
    paths: ['.github/workflows/verify-cybernote-114.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - name: Verify public post and image
        env:
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
        run: |
          python - <<'PY'
          import requests,os,json,io,hashlib
          from PIL import Image
          s=requests.Session()
          s.headers['User-Agent']=os.environ.get('WP_USER_AGENT') or 'Mozilla/5.0'
          base='https://www.cybernote.click'
          slug='cisco-secure-fmc-cve-2026-20242-java-rce'
          r=s.get(base+'/wp-json/wp/v2/posts',params={'slug':slug},timeout=60)
          print('REST HTTP',r.status_code);r.raise_for_status()
          posts=r.json();assert len(posts)==1
          p=posts[0];assert p['status']=='publish' and p['id']==8235
          assert 'CVE-2026-20242' in p['content']['rendered']
          print(json.dumps({'id':p['id'],'status':p['status'],'title':p['title']['rendered'],'date':p['date'],'url':p['link'],'featured_media':p['featured_media'],'duplicates':len(posts)},ensure_ascii=False))
          page=s.get(p['link'],timeout=60);print('PAGE',page.status_code,'CVE', 'CVE-2026-20242' in page.text,'table','<table' in page.text)
          assert page.status_code==200 and 'CVE-2026-20242' in page.text and '<table' in page.text
          m=s.get(base+'/wp-json/wp/v2/media/'+str(p['featured_media']),timeout=60);m.raise_for_status()
          img=s.get(m.json()['source_url'],timeout=60);img.raise_for_status()
          im=Image.open(io.BytesIO(img.content));im.load()
          print('IMAGE',img.status_code,im.size,im.mode,len(img.content),hashlib.sha256(img.content).hexdigest())
          assert im.size==(1200,800) and im.mode=='RGB' and img.content[:8]==bytes.fromhex('89504e470d0a1a0a')
          print('VERIFIED')
          PY
