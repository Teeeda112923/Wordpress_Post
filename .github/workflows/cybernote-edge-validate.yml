name: CyberNote Edge Validate
on: push
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Prepare ledger
        run: |
          python -c "from pathlib import Path; Path('/tmp/e.csv').write_text('No,記事タイトル,スラッグ,生成ステータス\n80,【重要】Microsoft EdgeにCVSS 8.8のRCE、最新版へ更新を,microsoft-edge-cve-2026-72984-type-confusion-rce,生成済み\n',encoding='utf-8-sig')"
      - name: Article quality
        run: python article_quality_check.py --input /tmp/e.csv --articles-dir projects/cybernote-security-news/articles --results /tmp/a.csv --nos 80 --include-unstarted --mode geo --fail-on-error
      - name: GEO quality
        run: python geo_article_quality_check.py --input /tmp/e.csv --articles-dir projects/cybernote-security-news/articles --results /tmp/g.csv --nos 80 --include-unstarted --mode geo --fail-on-error
      - name: Image validation
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import hashlib
          p=Path('projects/cybernote-security-news/eyecatches/microsoft-edge-cve-2026-72984-type-confusion-rce.png')
          b=p.read_bytes()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          with Image.open(p) as im:
              im.load(); print('IMAGE',im.format,im.size,im.mode,len(b))
              assert im.format=='PNG' and im.size==(1200,800) and im.mode=='RGB'
          print('BLOB',hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest())
          PY
