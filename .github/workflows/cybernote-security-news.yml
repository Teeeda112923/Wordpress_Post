name: CyberNote Security News

# 下書きを作ってから別枠で公開する2段階運用をやめ、1回の実行で公開まで行う。
# 下書きを人手で確認する運用になっていなかったため、公開段階（投稿の検索＋
# ステータス変更で1記事あたり2〜3リクエスト）は実質ただの余分なアクセスだった。
# WordPress側のボット対策に送るリクエストを減らすことを優先する。
# 2段階運用の名残だった publish ジョブ（既存の下書きを公開する stage=publish）は、
# 起動する cron を削除した時点で手動実行の経路しか残っておらず、実際に使われて
# いなかったため削除した。下書きを公開したいときは WordPress 管理画面から行う。
# 定期実行は1日4枠とし、各枠で品質ゲートを通過した記事を1件ずつ公開する。
# 対象がない枠では無理に投稿しない。
# 3枠だった頃は、記事が4件生成された日に1件が枠に入りきらず取りこぼしていた
# （公開予定日を過ぎた記事は誰も拾わないため、そのまま投稿されずに残る）。
# 枠は4時間間隔に散らす。短時間に集中させるとボット対策に遮断されるため、
# 枠を増やすときは間隔が詰まりすぎないか併せて確認すること。
#
# 当日分が無い枠では、直近の未投稿をさかのぼって拾う（既定3日、vars.BACKFILL_DAYS）。
# 公開予定日を過ぎた記事は誰も拾わないため、放っておくと永久に残るため。
# 当日分を最優先とし、空振りする枠だけを取りこぼしの回収に充てる。
# さかのぼる範囲は鮮度で決める。日付を明示した手動実行ではさかのぼらない。
on:
  schedule:
    # 08:30 JST
    - cron: "30 23 * * *"
    # 12:30 JST
    - cron: "30 3 * * *"
    # 16:30 JST
    - cron: "30 7 * * *"
    # 20:30 JST
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "対象日（YYYY-MM-DD、空欄なら日本時間の当日）"
        type: string
        required: false
        default: ""
      dry_run:
        description: "WordPressへ変更せず確認だけ行う"
        type: boolean
        required: true
        default: false
      retry_attempt:
        description: "（自動）Imunify360の遮断で落ちた後の再実行回数。手動実行では触らない"
        type: string
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  # Pythonの標準出力は端末以外だとブロックバッファリングになり、既定では
  # プロセスが終わるまでログに何も出ない。遮断で10分・20分待つ間が無言になり、
  # 待っているのか通信がハングしているのか実行中に判別できなかったため、
  # 実行中のログをそのまま流す。
  PYTHONUNBUFFERED: "1"
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  post:
    runs-on: ubuntu-latest
    # このジョブが待ちうる時間を全部足した値にする。足りないとタイムアウトが先に来て、
    # .wp_blocked が書かれる前にジョブが死に、いちばん再実行が必要な場面で
    # 遮断時の再実行が起動しない。
    #   再実行前の待機   最大60分（vars.BLOCK_RERUN_WAIT_MIN）
    #   遮断時の再試行   最大30分（10分 → 20分）
    #   checkout・依存インストール・投稿処理   5分程度
    # 60分では待機だけで使い切り、自動再実行が毎回きっかり60分でキャンセルされていた。
    # BLOCK_RERUN_WAIT_MIN を延ばすときは、この値も一緒に見直すこと。
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CyberNote regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      # Imunify360 の遮断は数時間続くことがある。wp_auto_post.py 側の再試行
      # （既定10分→20分）で足りなかった分を、実行し直しの前に待って埋める。
      # 通常の実行（retry_attempt が空か 0）では待たない。
      - name: Wait before retry
        if: ${{ inputs.retry_attempt != '' && inputs.retry_attempt != '0' }}
        env:
          WAIT_MIN: ${{ vars.BLOCK_RERUN_WAIT_MIN || '60' }}
        run: |
          # 1時間まるごと無言で待つと「止まっている」ようにしか見えず、実際に
          # 待機完了の直前で手動キャンセルされた。10分ごとに残り時間を出す。
          RESUME="$(TZ=Asia/Tokyo date -d "+${WAIT_MIN} minutes" '+%H:%M')"
          echo "遮断による再実行（${{ inputs.retry_attempt }}回目）のため ${WAIT_MIN} 分待ちます（${RESUME} JST 再開予定）"
          remaining="$WAIT_MIN"
          while [ "$remaining" -gt 10 ]; do
            sleep 600
            remaining=$(( remaining - 10 ))
            echo "  待機中… 残り ${remaining} 分（${RESUME} JST 再開予定）"
          done
          if [ "$remaining" -gt 0 ]; then
            sleep $(( remaining * 60 ))
          fi
          echo "待機終了。投稿処理を始めます"

      - name: Select today's news
        id: select
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          # 当日分が無いときに、何日前までさかのぼって未投稿を拾うか。
          # 脆弱性情報は数日で価値が落ちるため既定は3日。0で無効。
          BACKFILL_DAYS: ${{ vars.BACKFILL_DAYS || '3' }}
        run: |
          TARGET_DATE="$INPUT_TARGET_DATE"
          FALLBACK_ARG=""
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
            # 日付を指定しない通常の枠だけ、当日分が無いときに取りこぼしを拾う。
            # 日付を明示した手動実行では、指示された日だけを対象にする。
            FALLBACK_ARG="--fallback-days ${BACKFILL_DAYS}"
          fi

          SELECTED="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "$TARGET_DATE" \
            --stage draft \
            --skip-quality-error \
            --with-date \
            $FALLBACK_ARG)"   # select_news の draft = 未投稿の行を選ぶ、の意味

          NEWS_NO="$(printf '%s' "$SELECTED" | cut -f1)"
          # さかのぼって拾った場合は、当日ではなく実際に選んだ日を引き継ぐ。
          # 遮断で自動再実行するとき当日の日付を渡すと、拾ったはずの記事を
          # 見失って何も投稿されなくなるため。
          SELECTED_DATE="$(printf '%s' "$SELECTED" | cut -f2)"
          if [ -n "$SELECTED_DATE" ]; then
            TARGET_DATE="$SELECTED_DATE"
          fi

          echo "target_date=$TARGET_DATE"
          # 遮断で再実行するときは同じ日付を対象にする（日付をまたいでも枠を取りこぼさない）
          echo "target_date=$TARGET_DATE" >> "$GITHUB_OUTPUT"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

          if [ -z "$NEWS_NO" ]; then
            echo "本日の生成済みニュースはありません。投稿を行いません。"
          else
            echo "選択したNo: $NEWS_NO"
          fi

      - name: Article quality gate
        if: steps.select.outputs.selected_no != ''
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Publish to WordPress
        if: steps.select.outputs.selected_no != ''
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # ボット対策に弾かれる場合はリポジトリ変数 WP_USER_AGENT で上書きする
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          # CDN/WAF（Cloudflare等）を通すための追加ヘッダ。「名前: 値」を改行区切りで
          # シークレット WP_EXTRA_HEADERS に入れる。未設定なら何も送らない。
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --output-dir "$RESULTS_DIR" \
            $DRY_RUN_FLAG

      - name: Fail on WordPress errors
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not files:
              print("投稿結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)

          with files[-1].open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          matches = [row for row in rows if str(row.get("no", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)

          row = matches[-1]
          status = (row.get("status") or "").strip().lower()
          if status == "error":
              print(f"[ERROR] No.{selected}: {row.get('error_content') or row.get('message')}", file=sys.stderr)
              sys.exit(1)
          if status not in {"posted", "updated", "dry-run"}:
              print(f"[ERROR] No.{selected}: 予期しない結果ステータス: {status}", file=sys.stderr)
              sys.exit(1)
          print(f"WordPress投稿処理: {status}")
          PY

      - name: Update ledger after publish
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              result_rows = list(csv.DictReader(handle))
          matches = [row for row in result_rows if str(row.get("no", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status == "dry-run":
              print("dry-runのため管理簿は更新しません。")
              sys.exit(0)
          if status not in {"posted", "updated"}:
              print(f"管理簿更新対象外のステータスです: {status}", file=sys.stderr)
              sys.exit(1)

          ledger_path = Path(os.environ["LEDGER"])
          with ledger_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              ledger_rows = list(reader)

          changed = False
          for row in ledger_rows:
              if str(row.get("No", "")).strip() == selected:
                  row["投稿ステータス"] = "公開済み"
                  row["WP投稿ID"] = result.get("post_id", "")
                  row["WP投稿URL"] = result.get("post_link", "")
                  row["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  row["エラー内容"] = ""
                  changed = True
                  break
          if not changed:
              print(f"管理簿にNo.{selected}が見つかりません。", file=sys.stderr)
              sys.exit(1)

          with ledger_path.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)
          print(f"管理簿を公開済みに更新しました: No.{selected}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          if git diff --cached --quiet; then
            echo "管理簿変更なし"
          else
            git commit -m "Update CyberNote publish status"
            # 台帳を書いている間に他の実行やPRのマージが main を進めると push が
            # 弾かれる。投稿は済んでいるのに台帳だけ未投稿のまま残り、次の枠が
            # 同じ記事をもう一度投稿しにいく（実際に No.78 で発生した）。
            # 取り込んでから数回まで押し直す。
            pushed=0
            for attempt in 1 2 3; do
              if git push; then
                pushed=1
                break
              fi
              echo "pushが弾かれました。main を取り込んで再試行します（${attempt}/3）"
              git pull --rebase origin main
              sleep $(( attempt * 5 ))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error title=管理簿を更新できません::投稿は完了しましたが管理簿のpushに失敗しました。手動で投稿ステータスを更新してください"
              exit 1
            fi
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-post-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30

      # Imunify360 の遮断で落ちた場合だけ、時間をおいて自分を実行し直す。
      # 遮断以外の失敗（記事生成のエラー、画像の不備等）では .wp_blocked が
      # 作られないので再実行しない。1回の実行で投稿するのは従来どおり1記事だけで、
      # まとめ投稿にはしない（短時間に集中させると遮断されるため）。
      # GITHUB_TOKEN では workflow_dispatch から新しい実行が起きない仕様のため、
      # シークレット ACTIONS_PAT（Actions: Read and write のPAT）を使う。
      - name: Re-run later if blocked
        if: ${{ failure() && hashFiles('.wp_blocked') != '' }}
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          MAX_RERUN: ${{ vars.BLOCK_RERUN_MAX || '3' }}
          ATTEMPT: ${{ inputs.retry_attempt }}
          # スケジュール実行から落ちた場合 inputs は空になるため既定値で補う
          DRY_RUN: ${{ inputs.dry_run }}
          TARGET_DATE: ${{ steps.select.outputs.target_date }}
        run: |
          attempt="${ATTEMPT:-0}"
          next=$(( attempt + 1 ))
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=再実行できません::遮断で失敗しましたが、シークレット ACTIONS_PAT が未設定のため自動で実行し直せません。手動で再実行してください"
            exit 0
          fi
          if [ "$next" -gt "$MAX_RERUN" ]; then
            echo "::warning title=再実行を打ち切ります::${MAX_RERUN}回試しても遮断が解除されませんでした"
            exit 0
          fi
          echo "遮断のため ${next} 回目の再実行を予約します"
          gh workflow run cybernote-security-news.yml \
            --ref "${{ github.ref_name }}" \
            -f target_date="$TARGET_DATE" \
            -f dry_run="${DRY_RUN:-false}" \
            -f retry_attempt="$next"
