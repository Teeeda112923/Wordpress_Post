name: CyberNote Security News

on:
  schedule:
    # 18:30 JST
    - cron: "30 9 * * *"
    # 19:00 JST
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "実行段階"
        type: choice
        required: true
        default: "draft"
        options:
          - draft
          - publish
      target_date:
        description: "対象日（YYYY-MM-DD、空欄なら日本時間の当日）"
        type: string
        required: false
        default: ""
      dry_run:
        description: "WordPressへ変更せず確認だけ行う"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  draft:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 9 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'draft')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select today's news
        id: select
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="$INPUT_TARGET_DATE"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          NEWS_NO="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "$TARGET_DATE" \
            --stage draft)"

          echo "target_date=$TARGET_DATE"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

          if [ -z "$NEWS_NO" ]; then
            echo "本日の生成済みニュースはありません。投稿を行いません。"
          else
            echo "選択したNo: $NEWS_NO"
          fi

      - name: Article quality gate
        if: steps.select.outputs.selected_no != ''
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --include-unstarted \
            --fail-on-error

      - name: Create WordPress draft
        if: steps.select.outputs.selected_no != ''
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status draft \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --limit 1 \
            --output-dir "$RESULTS_DIR" \
            $DRY_RUN_FLAG

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-draft-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select today's news
        id: select
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="$INPUT_TARGET_DATE"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          NEWS_NO="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "$TARGET_DATE" \
            --stage publish)"

          echo "target_date=$TARGET_DATE"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

          if [ -z "$NEWS_NO" ]; then
            echo "公開対象がありません。公開処理を行いません。"
          else
            echo "公開するNo: $NEWS_NO"
          fi

      - name: Publish reviewed draft
        if: steps.select.outputs.selected_no != ''
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python projects/cybernote-security-news/src/publish_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --results-dir "$RESULTS_DIR" \
            --date "$INPUT_TARGET_DATE" \
            --no "${{ steps.select.outputs.selected_no }}" \
            $DRY_RUN_FLAG

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-publish-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
