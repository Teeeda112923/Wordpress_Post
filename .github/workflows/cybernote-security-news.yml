name: CyberNote Security News

# 下書きを作ってから別枠で公開する2段階運用をやめ、1回の実行で公開まで行う。
# 下書きを人手で確認する運用になっていなかったため、公開段階（投稿の検索＋
# ステータス変更で1記事あたり2〜3リクエスト）は実質ただの余分なアクセスだった。
# WordPress側のボット対策に送るリクエストを減らすことを優先する。
# 既存の下書きを公開したいときは stage=publish を手動実行する。
# 定期実行は1日8枠。記事の生成目安は1日5件で、残る3枠は同じ日に多く生成された
# ときの予備。1枠につき1記事だけ投稿し、2時間間隔で分散させる。
# 1回の実行でまとめて投稿する形にはしない（短時間に集中させると
# WordPress側のボット対策に遮断される。実際に6件連続で投稿して遮断された）。
#
# なお select_news.py は「公開予定日が当日」の行しか選ばないため、枠を増やしても
# 前日以前の取りこぼしは拾わない。古い記事を出したいときは target_date を
# 指定して手動実行する（脆弱性情報は鮮度が重要なため、自動では拾わせない）。
on:
  schedule:
    # 08:30 JST
    - cron: "30 23 * * *"
    # 10:30 JST
    - cron: "30 1 * * *"
    # 12:30 JST
    - cron: "30 3 * * *"
    # 14:30 JST
    - cron: "30 5 * * *"
    # 16:30 JST
    - cron: "30 7 * * *"
    # 18:30 JST
    - cron: "30 9 * * *"
    # 20:30 JST
    - cron: "30 11 * * *"
    # 22:30 JST
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "実行段階（post=記事を公開まで行う / publish=既存の下書きを公開する）"
        type: choice
        required: true
        default: "post"
        options:
          - post
          - publish
      target_date:
        description: "対象日（YYYY-MM-DD、空欄なら日本時間の当日）"
        type: string
        required: false
        default: ""
      dry_run:
        description: "WordPressへ変更せず確認だけ行う"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results

jobs:
  post:
    if: >-
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 23 * * *' ||
        github.event.schedule == '30 1 * * *' ||
        github.event.schedule == '30 3 * * *' ||
        github.event.schedule == '30 5 * * *' ||
        github.event.schedule == '30 7 * * *' ||
        github.event.schedule == '30 9 * * *' ||
        github.event.schedule == '30 11 * * *' ||
        github.event.schedule == '30 13 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'post')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select today's news
        id: select
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="$INPUT_TARGET_DATE"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          NEWS_NO="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "$TARGET_DATE" \
            --stage draft)"   # select_news の draft = 未投稿の行を選ぶ、の意味

          echo "target_date=$TARGET_DATE"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

          if [ -z "$NEWS_NO" ]; then
            echo "本日の生成済みニュースはありません。投稿を行いません。"
          else
            echo "選択したNo: $NEWS_NO"
          fi

      - name: Article quality gate
        if: steps.select.outputs.selected_no != ''
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Publish to WordPress
        if: steps.select.outputs.selected_no != ''
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # ボット対策に弾かれる場合はリポジトリ変数 WP_USER_AGENT で上書きする
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "${{ steps.select.outputs.selected_no }}" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --skip-existing-check \
            --output-dir "$RESULTS_DIR" \
            $DRY_RUN_FLAG

      - name: Fail on WordPress errors
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not files:
              print("投稿結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)

          with files[-1].open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          matches = [row for row in rows if str(row.get("no", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)

          row = matches[-1]
          status = (row.get("status") or "").strip().lower()
          if status == "error":
              print(f"[ERROR] No.{selected}: {row.get('error_content') or row.get('message')}", file=sys.stderr)
              sys.exit(1)
          if status not in {"posted", "updated", "dry-run"}:
              print(f"[ERROR] No.{selected}: 予期しない結果ステータス: {status}", file=sys.stderr)
              sys.exit(1)
          print(f"WordPress投稿処理: {status}")
          PY

      - name: Update ledger after publish
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              result_rows = list(csv.DictReader(handle))
          matches = [row for row in result_rows if str(row.get("no", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status == "dry-run":
              print("dry-runのため管理簿は更新しません。")
              sys.exit(0)
          if status not in {"posted", "updated"}:
              print(f"管理簿更新対象外のステータスです: {status}", file=sys.stderr)
              sys.exit(1)

          ledger_path = Path(os.environ["LEDGER"])
          with ledger_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              ledger_rows = list(reader)

          changed = False
          for row in ledger_rows:
              if str(row.get("No", "")).strip() == selected:
                  row["投稿ステータス"] = "公開済み"
                  row["WP投稿ID"] = result.get("post_id", "")
                  row["WP投稿URL"] = result.get("post_link", "")
                  row["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  row["エラー内容"] = ""
                  changed = True
                  break
          if not changed:
              print(f"管理簿にNo.{selected}が見つかりません。", file=sys.stderr)
              sys.exit(1)

          with ledger_path.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)
          print(f"管理簿を公開済みに更新しました: No.{selected}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          if git diff --cached --quiet; then
            echo "管理簿変更なし"
          else
            git commit -m "Update CyberNote publish status"
            git push
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-post-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30

  publish:
    if: >-
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 0 * * *' ||
        github.event.schedule == '20 3 * * *' ||
        github.event.schedule == '0 6 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select today's news
        id: select
        env:
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          TARGET_DATE="$INPUT_TARGET_DATE"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi

          NEWS_NO="$(python projects/cybernote-security-news/src/select_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --date "$TARGET_DATE" \
            --stage publish)"

          echo "target_date=$TARGET_DATE"
          echo "selected_no=$NEWS_NO" >> "$GITHUB_OUTPUT"

          if [ -z "$NEWS_NO" ]; then
            echo "公開対象がありません。公開処理を行いません。"
          else
            echo "公開するNo: $NEWS_NO"
          fi

      - name: Publish reviewed draft
        if: steps.select.outputs.selected_no != ''
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # ボット対策に弾かれる場合はリポジトリ変数 WP_USER_AGENT で上書きする
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          INPUT_TARGET_DATE: ${{ inputs.target_date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python projects/cybernote-security-news/src/publish_news.py \
            --ledger "$LEDGER" \
            --repo-root . \
            --articles-dir "$ARTICLES_DIR" \
            --eyecatches-dir "$IMAGES_DIR" \
            --results-dir "$RESULTS_DIR" \
            --date "$INPUT_TARGET_DATE" \
            --no "${{ steps.select.outputs.selected_no }}" \
            $DRY_RUN_FLAG

      - name: Fail on publish errors
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          files = sorted(Path(os.environ["RESULTS_DIR"]).glob("publish_*.csv"))
          if not files:
              print("公開結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)

          with files[-1].open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          matches = [row for row in rows if str(row.get("No", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の公開結果が見つかりません。", file=sys.stderr)
              sys.exit(1)

          row = matches[-1]
          status = (row.get("status") or "").strip().lower()
          if status not in {"published", "already_published", "dry-run"}:
              print(f"[ERROR] No.{selected}: {row.get('message')}", file=sys.stderr)
              sys.exit(1)
          print(f"WordPress公開処理: {status}")
          PY

      - name: Update ledger after publish
        if: steps.select.outputs.selected_no != ''
        env:
          TARGET_NO: ${{ steps.select.outputs.selected_no }}
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          selected = os.environ["TARGET_NO"].strip()
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("publish_*.csv"))
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              result_rows = list(csv.DictReader(handle))
          matches = [row for row in result_rows if str(row.get("No", "")).strip() == selected]
          if not matches:
              print(f"No.{selected} の公開結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status == "dry-run":
              print("dry-runのため管理簿は更新しません。")
              sys.exit(0)
          if status not in {"published", "already_published"}:
              print(f"管理簿更新対象外のステータスです: {status}", file=sys.stderr)
              sys.exit(1)

          ledger_path = Path(os.environ["LEDGER"])
          with ledger_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              ledger_rows = list(reader)

          changed = False
          for row in ledger_rows:
              if str(row.get("No", "")).strip() == selected:
                  row["投稿ステータス"] = "公開済み"
                  row["WP投稿ID"] = result.get("post_id", "")
                  row["WP投稿URL"] = result.get("post_link", "")
                  row["最終更新日時"] = result.get("published_at_jst", "")
                  row["エラー内容"] = ""
                  changed = True
                  break
          if not changed:
              print(f"管理簿にNo.{selected}が見つかりません。", file=sys.stderr)
              sys.exit(1)

          with ledger_path.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)
          print(f"管理簿を公開済みに更新しました: No.{selected}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          if git diff --cached --quiet; then
            echo "管理簿変更なし"
          else
            git commit -m "Update CyberNote publish status"
            git push
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cybernote-security-news-publish-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
