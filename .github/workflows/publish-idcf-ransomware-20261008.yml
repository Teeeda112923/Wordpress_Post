name: Publish IDCF Ransomware Incident
# Purge stale IDCF caches trigger: 2026-10-09 00:30 JST
# Inspect cache purge trigger: 2026-10-09 00:20 JST
# Diagnose public page trigger: 2026-10-09 00:10 JST
# Manual publish trigger: 2026-10-10 08:20 JST (Zenlogic impact clarification)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-idcf-ransomware-20261008.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news-fast-publish
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NO: '169'
  SLUG: idc-frontier-idcf-cloud-ransomware-2026
  STATUS_FILE: .github/idcf-ransomware-publication-status.txt
  PYTHONUNBUFFERED: '1'
  WP_BLOCK_RETRY_COUNT: '1'
  WP_SERVER_ERROR_RETRY_COUNT: '2'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt PyYAML
          mkdir -p "$RESULTS_DIR"

      # Retry publication with a truecolor RGB PNG for WordPress media compatibility.
      - name: Verify selected eyecatch identity
        run: |
          python verify_eyecatch_identity.py \
            --ledger "$LEDGER" \
            --images-dir "$IMAGES_DIR" \
            --nos "$TARGET_NO" \
            --require-from-no 147

      - name: Verify long-form article metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, yaml, os
          p=Path(os.environ['ARTICLES_DIR'])/(os.environ['SLUG']+'.md')
          text=p.read_text(encoding='utf-8')
          m=re.match(r'^---\s*\n(.*?)\n---\s*\n(.*)$',text,re.S)
          if not m:
              raise SystemExit('front matter missing')
          meta=yaml.safe_load(m.group(1)) or {}
          body=m.group(2)
          if not str(meta.get('answer') or '').strip().endswith('。'):
              raise SystemExit('answer missing')
          if len(meta.get('faq') or []) < 2:
              raise SystemExit('faq incomplete')
          if len(meta.get('sources') or []) < 1:
              raise SystemExit('sources incomplete')
          if '## まとめ' not in body:
              raise SystemExit('summary section missing')
          print('Long-form article accepted by explicit user instruction; standard 1,800-char ceiling intentionally bypassed.')
          PY

      - name: Run regression tests
        run: python -m unittest discover -s projects/cybernote-security-news/tests -p 'test_*.py'

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
          FALLBACK_MEDIA_ID: ${{ vars.WP_FALLBACK_MEDIA_ID || '5297' }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$FALLBACK_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify publication and update ledger
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv, datetime as dt, json, os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          no=os.environ['TARGET_NO']; slug=os.environ['SLUG']
          files=sorted(Path(os.environ['RESULTS_DIR']).glob('results_*.csv'))
          if not files: raise SystemExit('result CSV missing')
          with files[-1].open(encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f))
          matches=[r for r in rows if str(r.get('no','')).strip()==no]
          if not matches: raise SystemExit('target result missing')
          result=matches[-1]
          status=(result.get('status') or '').strip().lower()
          if status not in {'posted','updated'}:
              raise SystemExit(f"publication failed: {status}: {result.get('error_content') or result.get('message') or ''}")
          post_id=int(result.get('post_id') or 0); post_url=result.get('post_link') or ''
          if not post_id or not post_url: raise SystemExit('post id/url missing')

          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          post=wp.request('GET',f'posts/{post_id}',params={'context':'edit'})
          if post.get('status')!='publish': raise SystemExit(f"unexpected post status: {post.get('status')}")
          media_id=int(post.get('featured_media') or 0)
          if not media_id: raise SystemExit('featured media missing')
          media=wp.request('GET',f'media/{media_id}',params={'context':'edit'})
          media_source=str(media.get('source_url') or '')
          if slug not in media_source:
              raise SystemExit(f'eyecatch mismatch: {media_source}')

          meta=post.get('meta') or {}
          required=['_cng_answer','_cng_faq','_cng_sources']
          missing=[k for k in required if not meta.get(k)]
          if missing: raise SystemExit('GEO metadata missing: '+','.join(missing))
          faq=json.loads(meta['_cng_faq']) if isinstance(meta['_cng_faq'],str) else meta['_cng_faq']
          sources=json.loads(meta['_cng_sources']) if isinstance(meta['_cng_sources'],str) else meta['_cng_sources']
          if len(faq)<2 or len(sources)<1: raise SystemExit('GEO metadata incomplete')

          ledger=Path(os.environ['LEDGER'])
          with ledger.open(encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f); fields=reader.fieldnames; data=list(reader)
          found=False
          for row in data:
              if str(row.get('No','')).strip()==no:
                  row['投稿ステータス']='公開済み'
                  row['WP投稿ID']=str(post_id)
                  row['WP投稿URL']=post_url
                  row['最終更新日時']=dt.datetime.now().strftime('%Y-%m-%d %H:%M:%S')
                  row['エラー内容']=''
                  found=True
                  break
          if not found: raise SystemExit('ledger row missing')
          with ledger.open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(data)

          Path(os.environ['STATUS_FILE']).write_text(
              f"state=published\npost_id={post_id}\npost_url={post_url}\nfeatured_media={media_id}\nmedia_source={media_source}\ngeo_faq={len(faq)}\ngeo_sources={len(sources)}\nrun_url=https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n",
              encoding='utf-8'
          )
          print(post_url)
          PY

      - name: Diagnose public page state
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os, re, time, requests
          from wp_auto_post import WordPressClient
          wp=WordPressClient(os.environ['WP_BASE_URL'],os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          post=wp.request('GET','posts/8544',params={'context':'edit'})
          title=((post.get('title') or {}).get('raw') or (post.get('title') or {}).get('rendered') or '')
          raw=((post.get('content') or {}).get('raw') or '')
          print('REST_TITLE=', title)
          print('REST_HAS_TESLA=', 'tesla' in raw.lower())
          print('REST_HAS_THIRD_REPORT=', '第3報' in raw)
          url=post.get('link') or 'https://www.cybernote.click/2026/10/08/idc-frontier-idcf-cloud-ransomware-2026/'
          sess=requests.Session()
          headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'}
          for label,u in [('public',url),('bust',url+('?cb='+str(int(time.time()))))]:
              resp=sess.get(u,headers=headers,timeout=60)
              html=resp.text
              mt=re.search(r'<title[^>]*>(.*?)</title>',html,re.I|re.S)
              print(label.upper()+'_STATUS=',resp.status_code)
              print(label.upper()+'_TITLE=',re.sub(r'<[^>]+>','',mt.group(1)).strip() if mt else '')
              print(label.upper()+'_HAS_TESLA=', 'tesla' in html.lower())
              print(label.upper()+'_HAS_THIRD_REPORT=', '第3報' in html)
              for h in ['cf-cache-status','x-cache','x-litespeed-cache','x-proxy-cache','cache-control','age','server']:
                  if resp.headers.get(h) is not None:
                      print(label.upper()+'_HEADER_'+h+'=',resp.headers.get(h))
          PY

      - name: Inspect cache purge capabilities
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          user=os.environ['WP_USERNAME']; pw=os.environ['WP_APP_PASSWORD'].replace(' ','')
          token=base64.b64encode(f'{user}:{pw}'.encode()).decode()
          headers={'Authorization':'Basic '+token,'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}
          root=requests.get(base+'/wp-json/',headers=headers,timeout=60)
          print('REST_INDEX_STATUS=',root.status_code)
          try:
              data=root.json()
              routes=data.get('routes') or {}
              hits=[]
              for route, spec in routes.items():
                  low=route.lower()
                  if any(k in low for k in ['cache','purge','litespeed','cloudflare']):
                      methods=[]
                      for ep in spec.get('endpoints',[]) if isinstance(spec,dict) else []:
                          methods += list(ep.get('methods') or [])
                      hits.append((route,sorted(set(methods))))
              print('CACHE_ROUTES=',hits[:100])
          except Exception as e:
              print('REST_INDEX_PARSE_ERROR=',type(e).__name__,str(e)[:200])
          url=base+'/2026/10/08/idc-frontier-idcf-cloud-ransomware-2026/'
          for method in ['PURGE']:
              try:
                  resp=requests.request(method,url,headers=headers,timeout=60)
                  print(method+'_STATUS=',resp.status_code)
                  print(method+'_BODY=',resp.text[:300].replace('\n',' '))
                  for h in ['cf-cache-status','x-litespeed-cache','server']:
                      if resp.headers.get(h): print(method+'_HEADER_'+h+'=',resp.headers.get(h))
              except Exception as e:
                  print(method+'_ERROR=',type(e).__name__,str(e)[:200])
          PY

      - name: Purge IDCF page caches
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          python - <<'PY'
          import base64, os, re, requests, time
          base=os.environ['WP_BASE_URL'].rstrip('/')
          url=base+'/2026/10/08/idc-frontier-idcf-cloud-ransomware-2026/'
          token=base64.b64encode((os.environ['WP_USERNAME']+':'+os.environ['WP_APP_PASSWORD'].replace(' ','')).encode()).decode()
          h={'Authorization':'Basic '+token,'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}
          endpoints=[
            ('jetpack_site_cache',base+'/wp-json/jetpack/v4/site/cache/flush'),
            ('jetpack_boost_page_cache',base+'/wp-json/jetpack-boost-ds/page-cache/action/clear-page-cache'),
          ]
          for name,ep in endpoints:
              try:
                  r=requests.post(ep,headers=h,json={},timeout=60)
                  print(name+'_STATUS=',r.status_code)
                  print(name+'_BODY=',r.text[:240].replace('\n',' '))
              except Exception as e:
                  print(name+'_ERROR=',type(e).__name__,str(e)[:200])

          cf_token=os.environ.get('CLOUDFLARE_API_TOKEN') or os.environ.get('CF_API_TOKEN') or ''
          cf_zone=os.environ.get('CLOUDFLARE_ZONE_ID') or os.environ.get('CF_ZONE_ID') or ''
          print('CF_TOKEN_AVAILABLE=',bool(cf_token))
          print('CF_ZONE_AVAILABLE=',bool(cf_zone))
          if cf_token and cf_zone:
              try:
                  r=requests.post(
                    f'https://api.cloudflare.com/client/v4/zones/{cf_zone}/purge_cache',
                    headers={'Authorization':'Bearer '+cf_token,'Content-Type':'application/json'},
                    json={'files':[url]},
                    timeout=60,
                  )
                  data={}
                  try: data=r.json()
                  except Exception: pass
                  print('CLOUDFLARE_PURGE_STATUS=',r.status_code)
                  print('CLOUDFLARE_PURGE_SUCCESS=',data.get('success'))
                  if not (r.ok and data.get('success') is True):
                      print('CLOUDFLARE_PURGE_ERRORS=',data.get('errors'))
              except Exception as e:
                  print('CLOUDFLARE_PURGE_ERROR=',type(e).__name__,str(e)[:200])

          time.sleep(3)
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache','Pragma':'no-cache'},timeout=60)
          mt=re.search(r'<title[^>]*>(.*?)</title>',r.text,re.I|re.S)
          title=re.sub(r'<[^>]+>','',mt.group(1)).strip() if mt else ''
          print('AFTER_PURGE_STATUS=',r.status_code)
          print('AFTER_PURGE_TITLE=',title)
          print('AFTER_PURGE_HAS_THIRD_REPORT=', '第3報' in r.text)
          print('AFTER_PURGE_CF=',r.headers.get('cf-cache-status'))
          print('AFTER_PURGE_LITESPEED=',r.headers.get('x-litespeed-cache'))
          print('AFTER_PURGE_AGE=',r.headers.get('age'))
          if not title.startswith('【続報】'):
              raise SystemExit('通常URLがまだ旧キャッシュです')
          PY

      - name: Commit publication artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$STATUS_FILE"
          git commit -m "Record IDCF ransomware incident publication" || exit 0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idcf-ransomware-publication-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 14
