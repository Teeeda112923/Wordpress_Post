name: Temporary Ceph Ledger Updater

on:
  push:
    paths:
      - ".github/workflows/tmp-ceph-ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append and validate ledger row
        run: python projects/cybernote-security-news/tmp_append_ceph_ledger.py
      - name: Commit ledger and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cybernote-security-news/data/news_ledger.csv
          git rm projects/cybernote-security-news/tmp_append_ceph_ledger.py .github/workflows/tmp-ceph-ledger.yml
          git commit -m "Add Ceph CVE-2026-50152 ledger entry"
          git push
