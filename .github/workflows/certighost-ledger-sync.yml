name: Certighost Ledger Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: certighost-ledger-sync
  cancel-in-progress: true

jobs:
  sync:
    if: github.event.issue.title == '[one-shot] Certighost ledger sync'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ledger
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          source_path = Path('projects/cybernote-security-news/data/certighost_one_shot.csv')
          ledger_path = Path('projects/cybernote-security-news/data/news_ledger.csv')
          with source_path.open(encoding='utf-8-sig', newline='') as f:
              source = next(csv.DictReader(f))
          with ledger_path.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)
          if not fields:
              raise SystemExit('ledger header missing')
          slug = 'ad-cs-certighost-cve-2026-54121'
          target = next((r for r in rows if r.get('スラッグ') == slug), None)
          if target is None:
              nums = []
              for r in rows:
                  try:
                      nums.append(int(float(r.get('No') or 0)))
                  except ValueError:
                      pass
              target = {k: source.get(k, '') for k in fields}
              target['No'] = str(max(nums, default=0) + 1)
              rows.append(target)
          target['WP投稿ID'] = '7396'
          target['WP投稿URL'] = 'https://www.cybernote.click/2026/08/19/ad-cs-certighost-cve-2026-54121/'
          target['投稿ステータス'] = '公開済み'
          target['最終更新日時'] = datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d %H:%M:%S')
          target['エラー内容'] = ''
          with ledger_path.open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print('ledger row:', target['No'], target['スラッグ'], target['WP投稿ID'], target['投稿ステータス'])
          PY

      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/cybernote-security-news/data/news_ledger.csv
          if git diff --cached --quiet; then
            echo "No ledger changes"
            exit 0
          fi
          git commit -m "Record Certighost WordPress publication [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          exit 1

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost ledger sync succeeded. Post ID 7396 recorded."

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Certighost ledger sync failed."
