name: Traceable One-off IPA Safe Web Guide Publish

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/ipa-safe-web-guide-trigger.txt

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Japanese font
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Generate, validate, and publish IPA guide
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python projects/cybernote-security-news/src/oneoff_ipa_safe_web_publish.py

      - name: Commit ledger and eyecatch to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/cybernote-security-news/data/news_ledger.csv \
            projects/cybernote-security-news/eyecatches/ipa-safe-web-development-guide.png
          if git diff --cached --quiet; then
            echo "コミット対象の変更はありません。"
          else
            git commit -m "Update IPA guide publish status and eyecatch"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-safe-web-guide-traceable-results
          path: |
            projects/cybernote-security-news/results/*.csv
          if-no-files-found: warn
          retention-days: 30
