name: One-off CyberNote No.10 Draft

on:
  push:
    paths:
      - .github/workflows/codex-kindarails2shell-oneoff.yml

permissions:
  contents: write

jobs:
  post:
    if: github.event.head_commit.message == 'Run KindaRails2Shell WordPress draft'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEDGER: projects/cybernote-security-news/data/news_ledger.csv
      ARTICLES_DIR: projects/cybernote-security-news/articles
      IMAGES_DIR: projects/cybernote-security-news/eyecatches
      RESULTS_DIR: projects/cybernote-security-news/results
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Article quality gate
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --sheet "制作管理表" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --tolerance "0.03" \
            --nos "10" \
            --fail-on-error

      - name: WordPress dry-run
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --sheet "制作管理表" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status draft \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "10" \
            --limit "1" \
            --output-dir "$RESULTS_DIR" \
            --dry-run

      - name: Create WordPress draft
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --sheet "制作管理表" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status draft \
            --write-mode create_only \
            --category "サイバーセキュリティ" \
            --nos "10" \
            --limit "1" \
            --output-dir "$RESULTS_DIR"

      - name: Verify WordPress result
        run: |
          python - <<'PY'
          import csv
          import os
          import sys
          from pathlib import Path

          files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not files:
              print("投稿結果CSVが見つかりません。", file=sys.stderr)
              sys.exit(1)
          with files[-1].open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          matches = [row for row in rows if str(row.get("no", "")).strip() == "10"]
          if not matches:
              print("No.10の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          row = matches[-1]
          status = (row.get("status") or "").strip().lower()
          if status not in {"posted", "updated"}:
              print(f"No.10の投稿結果が不正です: {status} / {row.get('error_content') or row.get('message')}", file=sys.stderr)
              sys.exit(1)
          print(f"No.10 WordPress status: {status}")
          print(f"post_id={row.get('post_id', '')}")
          print(f"post_link={row.get('post_link', '')}")
          PY

      - name: Update news ledger
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          import sys
          from pathlib import Path

          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          with result_files[-1].open(encoding="utf-8-sig", newline="") as handle:
              result_rows = list(csv.DictReader(handle))
          matches = [row for row in result_rows if str(row.get("no", "")).strip() == "10"]
          if not matches:
              print("No.10の投稿結果が見つかりません。", file=sys.stderr)
              sys.exit(1)
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status not in {"posted", "updated"}:
              print(f"台帳更新対象外のステータスです: {status}", file=sys.stderr)
              sys.exit(1)

          ledger_path = Path(os.environ["LEDGER"])
          with ledger_path.open(encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              fieldnames = reader.fieldnames or []
              ledger_rows = list(reader)

          changed = False
          for row in ledger_rows:
              if str(row.get("No", "")).strip() == "10":
                  row["投稿ステータス"] = "下書き済み"
                  row["WP投稿ID"] = result.get("post_id", "")
                  row["WP投稿URL"] = result.get("post_link", "")
                  row["最終更新日時"] = result.get("posted_at") or result.get("updated_at") or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
                  row["エラー内容"] = ""
                  changed = True
                  break
          if not changed:
              print("台帳にNo.10が見つかりません。", file=sys.stderr)
              sys.exit(1)

          with ledger_path.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=fieldnames, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)
          print("No.10の台帳を下書き済みに更新しました。")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER"
          if git diff --cached --quiet; then
            echo "台帳変更なし"
          else
            git commit -m "Update CyberNote draft status"
            git push
          fi

      - name: Upload result CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-kindarails2shell-draft-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
