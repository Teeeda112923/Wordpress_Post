name: Publish September 2026 Cyber Incident Roundup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-september-2026-cyber-roundup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybernote-security-news
  cancel-in-progress: false

env:
  LEDGER: projects/cybernote-security-news/data/news_ledger.csv
  ARTICLES_DIR: projects/cybernote-security-news/articles
  IMAGES_DIR: projects/cybernote-security-news/eyecatches
  RESULTS_DIR: projects/cybernote-security-news/results
  TARGET_NO: '144'
  TARGET_MEDIA_ID: '5297'
  EXPECTED_MEDIA_NAME: 'daily-security-news-hero-1'
  STATUS_FILE: .github/september-2026-cyber-roundup-publication-status.txt
  PYTHONUNBUFFERED: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p "$RESULTS_DIR"

      - name: Article quality gate
        run: |
          python article_quality_check.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --results "$RESULTS_DIR/article_quality_results.csv" \
            --nos "$TARGET_NO" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Verify requested existing eyecatch
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import os
          from wp_auto_post import WordPressClient

          wp = WordPressClient(
              os.environ["WP_BASE_URL"],
              os.environ["WP_USERNAME"],
              os.environ["WP_APP_PASSWORD"],
          )
          media_id = int(os.environ["TARGET_MEDIA_ID"])
          expected = os.environ["EXPECTED_MEDIA_NAME"]
          source = wp.get_media_source_url(media_id)
          if not source:
              raise SystemExit(f"media id={media_id} がWordPress上で確認できません")
          print("eyecatch_source=", source)
          if expected not in source:
              raise SystemExit(
                  f"指定アイキャッチとmedia id={media_id}が一致しません: {source}"
              )
          PY

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input "$LEDGER" \
            --articles-dir "$ARTICLES_DIR" \
            --images-dir "$IMAGES_DIR" \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "$TARGET_NO" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --fallback-media-id "$TARGET_MEDIA_ID" \
            --output-dir "$RESULTS_DIR"

      - name: Verify publication, GEO metadata and update ledger
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          target = os.environ["TARGET_NO"]
          result_files = sorted(Path(os.environ["RESULTS_DIR"]).glob("results_*.csv"))
          if not result_files:
              raise SystemExit("WordPress result CSV was not created")
          with result_files[-1].open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          matches = [r for r in rows if str(r.get("no", "")).strip() == target]
          if not matches:
              raise SystemExit(f"No.{target} result is missing")
          result = matches[-1]
          status = (result.get("status") or "").strip().lower()
          if status not in {"posted", "updated"}:
              raise SystemExit(
                  f"Publication failed: {status}: "
                  f"{result.get('error_content') or result.get('message') or ''}"
              )
          post_id = int(result.get("post_id") or 0)
          post_link = result.get("post_link", "")
          if not post_id or not post_link:
              raise SystemExit("WordPress post ID or link is missing")

          wp = WordPressClient(
              os.environ["WP_BASE_URL"],
              os.environ["WP_USERNAME"],
              os.environ["WP_APP_PASSWORD"],
          )
          post = wp.request("GET", f"posts/{post_id}", params={"context": "edit"})
          if int(post.get("featured_media") or 0) != int(os.environ["TARGET_MEDIA_ID"]):
              raise SystemExit(
                  f"指定アイキャッチが設定されていません: featured_media={post.get('featured_media')}"
              )

          meta = post.get("meta") or {}
          required = ["_cng_answer", "_cng_faq", "_cng_sources"]
          missing = [key for key in required if not meta.get(key)]
          if missing:
              raise SystemExit("GEO Site Kitメタが未保存です: " + ", ".join(missing))

          try:
              faq = json.loads(meta["_cng_faq"]) if isinstance(meta["_cng_faq"], str) else meta["_cng_faq"]
              sources = json.loads(meta["_cng_sources"]) if isinstance(meta["_cng_sources"], str) else meta["_cng_sources"]
          except Exception as exc:
              raise SystemExit(f"GEO Site Kit JSONの検証に失敗しました: {exc}")
          if len(faq) < 2 or len(sources) < 1:
              raise SystemExit("GEO Site KitのFAQまたは出典が不足しています")
          print(f"GEO_OK answer=1 faq={len(faq)} sources={len(sources)}")
          print("PUBLISHED:", post_link)

          ledger = Path(os.environ["LEDGER"])
          with ledger.open(encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              ledger_rows = list(reader)
          row = next((r for r in ledger_rows if str(r.get("No", "")).strip() == target), None)
          if row is None:
              raise SystemExit(f"No.{target} not found in ledger")
          row["投稿ステータス"] = "公開済み"
          row["WP投稿ID"] = str(post_id)
          row["WP投稿URL"] = post_link
          row["最終更新日時"] = (
              result.get("posted_at")
              or result.get("updated_at")
              or dt.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          )
          row["エラー内容"] = ""
          with ledger.open("w", encoding="utf-8-sig", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
              writer.writeheader()
              writer.writerows(ledger_rows)

          Path(os.environ["STATUS_FILE"]).write_text(
              "state=published\n"
              + f"post_id={post_id}\n"
              + f"post_url={post_link}\n"
              + f"featured_media={post.get('featured_media')}\n"
              + f"geo_faq={len(faq)}\n"
              + f"geo_sources={len(sources)}\n"
              + f"run_url=https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n",
              encoding="utf-8",
          )
          PY

      - name: Commit publication result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LEDGER" "$STATUS_FILE"
          git commit -m "Record published September 2026 cyber roundup" || true
          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git pull --rebase origin main
            sleep $(( attempt * 5 ))
          done
          test "$pushed" -eq 1

      - name: Record failure status
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'state=failed\nrun_id=%s\nrun_url=https://github.com/%s/actions/runs/%s\n' "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$STATUS_FILE"
          git add -f "$STATUS_FILE"
          git commit -m "Record failed September cyber roundup publication" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: september-2026-cyber-roundup-results
          path: |
            ${{ env.RESULTS_DIR }}/*.csv
          if-no-files-found: warn
          retention-days: 30
