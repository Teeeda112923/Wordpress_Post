name: Publish IPA Trusted AI Platform 2026

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-ipa-trusted-ai-platform-2026.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SLUG: ipa-trusted-ai-platform-offline-2026
      ARTICLE: projects/cybernote-security-news/articles/ipa-trusted-ai-platform-offline-2026.md
      IMAGE_DIR: projects/cybernote-security-news/eyecatches
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and Japanese fonts
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Render eyecatch and H2 illustrations
        run: |
          mkdir -p "$IMAGE_DIR" /tmp/ipa-inline
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          import os

          W, H = 1200, 800
          BG = (7, 22, 39)
          PANEL = (10, 35, 55)
          PANEL2 = (10, 45, 66)
          CYAN = (34, 211, 238)
          GREEN = (52, 211, 153)
          WHITE = (242, 247, 250)
          MUTED = (170, 194, 211)
          RED = (244, 63, 94)
          GRID = (18, 63, 88)

          font_candidates = [
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
              "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
              "/usr/share/fonts/truetype/noto/NotoSansCJK-Regular.ttc",
          ]
          font_path = next((p for p in font_candidates if Path(p).exists()), None)
          if not font_path:
              raise RuntimeError("Noto Sans CJK font not found")

          def f(size, bold=False):
              bold_path = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"
              return ImageFont.truetype(bold_path if bold and Path(bold_path).exists() else font_path, size)

          def base():
              im = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(im)
              for x in range(0, W, 60):
                  d.line((x, 0, x, H), fill=GRID, width=1)
              for y in range(0, H, 60):
                  d.line((0, y, W, y), fill=GRID, width=1)
              return im, d

          def rounded(d, box, outline=CYAN, fill=PANEL, radius=24, width=2):
              d.rounded_rectangle(box, radius=radius, fill=fill, outline=outline, width=width)

          def center_text(d, box, text, font, fill=WHITE):
              l,t,r,b = box
              bb = d.multiline_textbbox((0,0), text, font=font, spacing=8, align="center")
              tw, th = bb[2]-bb[0], bb[3]-bb[1]
              d.multiline_text(((l+r-tw)/2, (t+b-th)/2), text, font=font, fill=fill, spacing=8, align="center")

          def shield(d, cx, cy, scale=1.0, color=GREEN):
              pts=[(cx,cy-120*scale),(cx+115*scale,cy-75*scale),(cx+95*scale,cy+55*scale),(cx,cy+145*scale),(cx-95*scale,cy+55*scale),(cx-115*scale,cy-75*scale)]
              d.polygon(pts, outline=color, fill=(8,31,48))
              d.line(pts+[pts[0]], fill=color, width=max(2,int(5*scale)))

          def server(d, cx, cy, w=180, h=220):
              rounded(d,(cx-w//2,cy-h//2,cx+w//2,cy+h//2),outline=CYAN,fill=(9,30,48),radius=12,width=3)
              for i in range(5):
                  y=cy-h//2+24+i*36
                  d.rounded_rectangle((cx-w//2+18,y,cx+w//2-18,y+24),radius=5,fill=(13,53,75),outline=CYAN,width=1)
                  d.ellipse((cx+w//2-44,y+7,cx+w//2-32,y+19),fill=GREEN)
              d.text((cx-42,cy+80),"AI",font=f(42,True),fill=WHITE)

          def icon_check(d,cx,cy,r=34):
              d.ellipse((cx-r,cy-r,cx+r,cy+r),outline=GREEN,width=4)
              d.line((cx-r//2,cy,cx-5,cy+r//2,cx+r//2,cy-r//2),fill=GREEN,width=6,joint="curve")

          def footer_badges(d, labels):
              x=45
              for lab in labels:
                  w=240
                  rounded(d,(x,680,x+w,750),outline=(28,100,125),fill=(8,29,46),radius=14,width=1)
                  d.text((x+18,699),lab,font=f(22,True),fill=GREEN)
                  x+=w+18

          # Eyecatch
          im,d=base()
          d.rectangle((0,0,560,H),fill=(5,19,34))
          d.text((45,80),"IPAが",font=f(68,True),fill=CYAN)
          d.text((45,175),"『信頼できる",font=f(66,True),fill=GREEN)
          d.text((45,270),"AI基盤』を実証",font=f(65,True),fill=WHITE)
          d.line((45,380,540,380),fill=CYAN,width=3)
          d.text((48,410),"オフライン閉域環境でAIを管理・検証",font=f(28,True),fill=WHITE)
          shield(d,850,350,1.25)
          server(d,850,350,210,255)
          d.rounded_rectangle((735,105,965,155),radius=12,outline=GREEN,width=2,fill=(7,30,46))
          center_text(d,(735,105,965,155),"オフライン閉域環境",f(23,True),GREEN)
          d.line((995,90,995,620),fill=CYAN,width=5)
          d.line((1000,350,1100,350),fill=RED,width=4)
          d.text((1030,315),"×",font=f(56,True),fill=RED)
          d.text((1025,145),"外部ネットワーク",font=f(24,True),fill=RED)
          d.text((1030,190),"クラウド / Internet",font=f(20),fill=MUTED)
          footer_badges(d,["信頼性","ガバナンス","可視性","コントロール"])
          im.save(Path(os.environ["IMAGE_DIR"])/f'{os.environ["SLUG"]}.png',optimize=True)

          # Overview
          im,d=base()
          d.text((55,45),"IPAが公開した『信頼できるAI基盤の実証』とは",font=f(42,True),fill=WHITE)
          d.text((55,110),"IPAの卒業プロジェクト",font=f(24,True),fill=GREEN)
          shield(d,585,390,1.15); server(d,585,390,190,235)
          nodes=[(220,250,"AI RMF"),(945,250,"ISO/IEC\n42001"),(585,650,"ICS-XAF")]
          for x,y,lab in nodes:
              d.ellipse((x-90,y-70,x+90,y+70),fill=PANEL2,outline=CYAN,width=3)
              center_text(d,(x-90,y-70,x+90,y+70),lab,f(26,True),CYAN)
              d.line((x,y,585,390),fill=(25,117,145),width=3)
          rounded(d,(850,500,1145,710),outline=GREEN,fill=PANEL,radius=20,width=2)
          lines=["1  AIを使うだけでなく管理する","2  構成・動作を把握できる","3  統制可能性を検証"]
          for i,t in enumerate(lines): d.text((875,535+i*55),t,font=f(21,True),fill=GREEN if i else WHITE)
          im.save('/tmp/ipa-inline/overview.png',optimize=True)

          # Offline architecture
          im,d=base()
          d.text((55,45),"オフライン閉域環境の構成",font=f(46,True),fill=GREEN)
          shield(d,640,405,1.55); server(d,640,400,210,260)
          boxes=[(350,230,"Debian 13"),(350,500,"OSS"),(840,230,"認証"),(840,500,"監査ログ"),(540,650,"RAG")]
          for x,y,lab in boxes:
              rounded(d,(x-105,y-45,x+105,y+45),outline=CYAN,fill=PANEL,radius=14,width=2)
              center_text(d,(x-105,y-45,x+105,y+45),lab,f(25,True),WHITE)
              d.line((x,y,640,400),fill=(28,132,155),width=2)
          d.line((1000,100,1000,700),fill=CYAN,width=5)
          d.text((1025,160),"外部ネットワーク",font=f(25,True),fill=WHITE)
          d.text((1030,310),"×",font=f(70,True),fill=RED)
          for i,t in enumerate(["✓ 外部通信を制限","✓ 内部でAIを運用","✓ ログと構成を確認"]):
              d.text((55,210+i*72),t,font=f(29,True),fill=GREEN if i==0 else WHITE)
          im.save('/tmp/ipa-inline/offline.png',optimize=True)

          # Six insights
          im,d=base()
          d.text((250,42),"実証で見えた6つの知見",font=f(50,True),fill=WHITE)
          d.text((745,42),"6つの知見",font=f(50,True),fill=GREEN)
          labels=["性能より\n統制可能性","供給元と\n変更を監視","RAGで組織の\n文脈を付与","設定も精度を左右","BCPにも\n活用可能","運用ルールで補完"]
          for i,lab in enumerate(labels):
              row,col=divmod(i,3); x=55+col*385; y=160+row*300
              rounded(d,(x,y,x+345,y+245),outline=CYAN,fill=PANEL,radius=20,width=2)
              d.text((x+20,y+15),str(i+1),font=f(42,True),fill=GREEN)
              icon_check(d,x+172,y+95,38)
              center_text(d,(x+20,y+145,x+325,y+230),lab,f(27,True),WHITE)
          im.save('/tmp/ipa-inline/six-insights.png',optimize=True)

          # Control gap
          im,d=base()
          d.text((175,38),"クラウドAIの『統制の空白地帯』とは",font=f(44,True),fill=WHITE)
          rounded(d,(45,135,420,680),outline=CYAN,fill=(7,34,57),radius=24,width=2)
          d.text((150,165),"クラウドAI",font=f(32,True),fill=CYAN)
          d.ellipse((115,260,350,420),fill=(12,73,108),outline=CYAN,width=4)
          center_text(d,(115,260,350,420),"AI\nCloud",f(42,True),WHITE)
          rounded(d,(445,135,790,680),outline=GREEN,fill=(8,32,49),radius=24,width=2)
          d.text((505,165),"統制の空白地帯",font=f(31,True),fill=GREEN)
          gaps=["モデル更新","RAGの根拠","監査ログ","耐障害性","暗号移行"]
          for i,t in enumerate(gaps):
              y=245+i*75; rounded(d,(480,y,750,y+55),outline=(38,119,139),fill=PANEL2,radius=10,width=1)
              d.text((505,y+12),t,font=f(23,True),fill=WHITE); d.text((710,y+7),"?",font=f(32,True),fill=GREEN)
          rounded(d,(820,135,1155,680),outline=GREEN,fill=(7,42,48),radius=24,width=2)
          d.text((860,165),"組織側で検証",font=f(31,True),fill=GREEN)
          shield(d,985,390,.92); server(d,985,390,155,185)
          for i,t in enumerate(["データ統制","設定・変更管理","監査・ログ取得","運用・可用性設計"]):
              d.text((845,555+i*28),"✓ "+t,font=f(18,True),fill=WHITE)
          im.save('/tmp/ipa-inline/control-gap.png',optimize=True)
          PY

      - name: Create one-off ledger
        run: |
          cat > /tmp/ipa-ledger.csv <<'CSV'
          No,収集日,公開予定日,記事分類,指定KW,話題性スコア,記事タイトル案,記事タイトル,スラッグ,メタディスクリプション,WPカテゴリ,タグ案,記事ファイル,画像ファイル名,主な出典URL,内部リンクURL,目標文字数,生成ステータス,レビュー判定,公開停止,WP投稿ID,WP投稿URL,投稿ステータス,最終更新日時,エラー内容,候補ID
          999,2026-09-03,2026-09-03,AIセキュリティ,信頼できるAI基盤,95,IPAが「信頼できるAI基盤」を実証,IPAが「信頼できるAI基盤」を実証｜オフライン閉域環境でAIを管理・検証する取り組み,ipa-trusted-ai-platform-offline-2026,IPAの「信頼できるAI基盤の実証」を紹介。オフライン閉域AI、統制可能性、6つの知見、クラウドAIの「統制の空白地帯」を解説します。,サイバーセキュリティ,,projects/cybernote-security-news/articles/ipa-trusted-ai-platform-offline-2026.md,ipa-trusted-ai-platform-offline-2026.png,https://www.ipa.go.jp/jinzai/ics/core_human_resource/final_project/2026/pm_ai.html,https://www.cybernote.click/2026/07/24/information-communications-2026/,1500,生成済み,レビュー済み,,,,,,,ipa-trusted-ai-20260903
          CSV

      - name: Article quality gate
        run: |
          python article_quality_check.py \
            --input /tmp/ipa-ledger.csv \
            --articles-dir projects/cybernote-security-news/articles \
            --results /tmp/ipa-quality.csv \
            --nos "999" \
            --include-unstarted \
            --mode geo \
            --fail-on-error

      - name: Upload H2 illustrations and inject into article
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          mkdir -p /tmp/projects/cybernote-security-news/articles
          python - <<'PY'
          import os
          from pathlib import Path
          from wp_auto_post import WordPressClient

          wp = WordPressClient(os.environ["WP_BASE_URL"], os.environ["WP_USERNAME"], os.environ["WP_APP_PASSWORD"])
          src = Path("projects/cybernote-security-news/articles/ipa-trusted-ai-platform-offline-2026.md")
          md = src.read_text(encoding="utf-8")
          items = {
              "overview": (Path("/tmp/ipa-inline/overview.png"), "IPAの信頼できるAI基盤の実証概要"),
              "offline": (Path("/tmp/ipa-inline/offline.png"), "オフライン閉域AI基盤の構成"),
              "six-insights": (Path("/tmp/ipa-inline/six-insights.png"), "IPAの実証で見えた6つの知見"),
              "control-gap": (Path("/tmp/ipa-inline/control-gap.png"), "クラウドAIの統制の空白地帯"),
          }
          for key, (path, alt) in items.items():
              _, url = wp.upload_media(path, alt_text="")
              if not url:
                  raise RuntimeError(f"inline media URL missing: {key}")
              md = md.replace(f"<!-- INLINE_IMAGE: {key} -->", f"![{alt}]({url})")
              print(f"inline image uploaded: {key} -> {url}")
          out = Path("/tmp/projects/cybernote-security-news/articles/ipa-trusted-ai-platform-offline-2026.md")
          out.write_text(md, encoding="utf-8")
          PY

      - name: Publish to WordPress
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_USER_AGENT: ${{ vars.WP_USER_AGENT }}
          WP_EXTRA_HEADERS: ${{ secrets.WP_EXTRA_HEADERS }}
        run: |
          python wp_auto_post.py \
            --input /tmp/ipa-ledger.csv \
            --articles-dir /tmp/projects/cybernote-security-news/articles \
            --images-dir projects/cybernote-security-news/eyecatches \
            --post-status publish \
            --write-mode upsert \
            --category "サイバーセキュリティ" \
            --nos "999" \
            --limit 1 \
            --skip-auth-check \
            --skip-internal-link-resolution \
            --output-dir /tmp/ipa-results

      - name: Show result
        if: always()
        run: |
          echo "=== quality ==="
          cat /tmp/ipa-quality.csv 2>/dev/null || true
          echo "=== post result ==="
          cat /tmp/ipa-results/wordpress_post_results.csv 2>/dev/null || find /tmp/ipa-results -maxdepth 2 -type f -print -exec cat {} \; 2>/dev/null || true
