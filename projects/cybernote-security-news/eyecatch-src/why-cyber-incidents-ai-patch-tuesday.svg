<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071b2c"/><stop offset="1" stop-color="#0b2a46"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".56" stop-color="#34d399"/><stop offset="1" stop-color="#f43f5e"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
  </filter>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38" fill="none" stroke="#16415f" stroke-width="1" opacity=".25"/>
  </pattern>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<rect width="1200" height="800" fill="url(#grid)"/>

<!-- subtle city silhouette -->
<g fill="#061522" opacity=".72">
  <rect x="0" y="690" width="65" height="110"/><rect x="74" y="652" width="82" height="148"/>
  <rect x="165" y="710" width="48" height="90"/><rect x="220" y="668" width="72" height="132"/>
  <rect x="300" y="724" width="55" height="76"/><rect x="366" y="680" width="84" height="120"/>
  <rect x="460" y="701" width="60" height="99"/><rect x="531" y="660" width="78" height="140"/>
  <rect x="621" y="718" width="42" height="82"/><rect x="675" y="676" width="81" height="124"/>
  <rect x="770" y="703" width="55" height="97"/><rect x="838" y="648" width="80" height="152"/>
  <rect x="930" y="710" width="54" height="90"/><rect x="993" y="675" width="75" height="125"/>
  <rect x="1080" y="694" width="50" height="106"/><rect x="1138" y="641" width="62" height="159"/>
</g>

<!-- Japan dotted motif -->
<g fill="#1d6a94" opacity=".48" transform="translate(1012 54) rotate(20)">
  <circle cx="0" cy="0" r="5"/><circle cx="16" cy="10" r="4"/><circle cx="28" cy="22" r="5"/>
  <circle cx="40" cy="35" r="4"/><circle cx="48" cy="52" r="5"/><circle cx="45" cy="70" r="4"/>
  <circle cx="34" cy="86" r="5"/><circle cx="23" cy="103" r="4"/><circle cx="16" cy="120" r="5"/>
  <circle cx="10" cy="138" r="4"/><circle cx="0" cy="154" r="5"/><circle cx="-10" cy="171" r="4"/>
  <circle cx="-20" cy="188" r="5"/><circle cx="-33" cy="203" r="4"/><circle cx="-48" cy="216" r="5"/>
  <circle cx="-65" cy="227" r="4"/><circle cx="-82" cy="236" r="5"/><circle cx="-100" cy="241" r="4"/>
</g>

<!-- headline -->
<g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-weight="800">
  <text x="70" y="122" font-size="80" fill="#22d3ee">AI</text>
  <text x="190" y="122" font-size="74" fill="#f8fafc">で縮む</text>
  <text x="70" y="222" font-size="86" fill="#f43f5e">攻撃</text>
  <text x="255" y="222" font-size="82" fill="#f8fafc">までの</text>
  <text x="560" y="222" font-size="86" fill="#34d399">時間</text>
</g>
<text x="72" y="286" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#eaf5fb">
  Patch Tuesday → Exploit Wednesday
</text>
<text x="74" y="328" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="22" fill="#9fc4d8">
  パッチ公開から悪用までの「猶予」がAIで短くなる
</text>

<!-- left device -->
<g transform="translate(78 428)" filter="url(#shadow)">
  <rect x="0" y="0" width="210" height="142" rx="15" fill="#102f4a" stroke="#2d6d91" stroke-width="3"/>
  <rect x="18" y="17" width="174" height="105" rx="8" fill="#071b2c"/>
  <path d="M42 54h34v34H42zm38 0h34v34H80zm-38 38h34v34H42zm38 0h34v34H80z" transform="scale(.72)" fill="#5ecce7"/>
  <path d="M150 48l30 12v26c0 26-17 45-30 50-13-5-30-24-30-50V60z" fill="#22d3ee" opacity=".92"/>
  <path d="M137 83l10 10 19-24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M-12 150h234l-22 20H12z" fill="#315c78"/>
</g>

<!-- Tuesday card -->
<g transform="translate(340 404)" filter="url(#shadow)" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <rect width="164" height="180" rx="18" fill="#f8fafc"/>
  <rect width="164" height="52" rx="18" fill="#22d3ee"/>
  <rect y="34" width="164" height="18" fill="#22d3ee"/>
  <circle cx="42" cy="0" r="9" fill="#a7ebf5"/><circle cx="122" cy="0" r="9" fill="#a7ebf5"/>
  <text x="82" y="36" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">火曜日</text>
  <text x="82" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1f33">Patch</text>
  <text x="82" y="129" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="800" fill="#0b1f33">Tuesday</text>
  <text x="82" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#3c5c70">更新公開</text>
</g>

<!-- center accelerated chain -->
<g transform="translate(524 430)">
  <path d="M0 73H244" stroke="url(#flow)" stroke-width="38" stroke-linecap="round"/>
  <path d="M233 45l44 28-44 28z" fill="#f43f5e"/>
  <g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle">
    <text x="28" y="0"><tspan x="28">脆弱性解析</tspan><tspan x="28" dy="25">の高速化</tspan></text>
    <text x="121" y="0"><tspan x="121">標的探索</tspan><tspan x="121" dy="25">の自動化</tspan></text>
    <text x="216" y="0"><tspan x="216">攻撃準備</tspan><tspan x="216" dy="25">の迅速化</tspan></text>
  </g>
  <circle cx="28" cy="73" r="10" fill="#e6fbff"/><circle cx="121" cy="73" r="10" fill="#e8fff6"/><circle cx="216" cy="73" r="10" fill="#fff0f3"/>
</g>

<!-- Wednesday card -->
<g transform="translate(818 404)" filter="url(#shadow)" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <rect width="164" height="180" rx="18" fill="#f8fafc"/>
  <rect width="164" height="52" rx="18" fill="#f43f5e"/>
  <rect y="34" width="164" height="18" fill="#f43f5e"/>
  <circle cx="42" cy="0" r="9" fill="#ffc2cc"/><circle cx="122" cy="0" r="9" fill="#ffc2cc"/>
  <text x="82" y="36" text-anchor="middle" font-size="25" font-weight="800" fill="#fff">水曜日</text>
  <text x="82" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#0b1f33">Exploit</text>
  <text x="82" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#0b1f33">Wednesday</text>
  <text x="82" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#733345">悪用開始</text>
</g>

<!-- right code window + clock -->
<g transform="translate(1005 393)" filter="url(#shadow)">
  <rect x="0" y="0" width="156" height="142" rx="12" fill="#061724" stroke="#2c6c8c" stroke-width="3"/>
  <circle cx="18" cy="18" r="4" fill="#f43f5e"/><circle cx="31" cy="18" r="4" fill="#fbbf24"/><circle cx="44" cy="18" r="4" fill="#34d399"/>
  <g stroke-width="8" stroke-linecap="round">
    <path d="M18 51h52M18 72h84M18 93h62M89 51h45M101 72h33M94 93h40" stroke="#22d3ee"/>
    <path d="M18 114h41M76 114h58" stroke="#f43f5e"/>
  </g>
  <circle cx="90" cy="145" r="54" fill="#f8fafc" stroke="#6f94a9" stroke-width="6"/>
  <circle cx="90" cy="145" r="5" fill="#0b1f33"/>
  <path d="M90 145v-34M90 145l22 12" stroke="#0b1f33" stroke-width="6" stroke-linecap="round"/>
  <path d="M151 143l34 60h-68z" fill="#f43f5e"/>
  <text x="151" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="#fff">!</text>
</g>

<!-- bottom callout -->
<g font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif">
  <rect x="332" y="636" width="548" height="76" rx="20" fill="#0e3857" stroke="#1d597d" stroke-width="2"/>
  <text x="606" y="670" text-anchor="middle" font-size="23" font-weight="800" fill="#f8fafc">AI時代の焦点は「何を守るか」だけではない</text>
  <text x="606" y="701" text-anchor="middle" font-size="25" font-weight="800" fill="#34d399">「何時間で守れるか」が問われる</text>
</g>
<text x="72" y="760" font-family="'Noto Sans CJK JP','Noto Sans JP',sans-serif" font-size="17" fill="#75a5be">CyberNote｜サイバーセキュリティ・AIコラム</text>
</svg>